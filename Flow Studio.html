document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

dden;background-color:#0d0d0d;background-image:{{ gridImage }};background-size:{{ gridSize }};background-position:{{ gridPos }};cursor:{{ canvasCursor }}\">\n        <div style=\"position:absolute;left:0;top:0;transform-origin:0 0;transform:{{ layerTransform }}\">\n          <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"6\">\n            <div style=\"position:absolute;left:{{ g.x }}px;top:{{ g.y }}px;width:{{ g.w }}px;height:{{ g.h }}px;border:1px solid {{ g.border }};background:{{ g.bg }};box-sizing:border-box;pointer-events:none\">\n              <div style=\"height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,0.05)\">\n                <span style=\"font-family:'Geist Mono',monospace;font-size:10px;color:{{ g.numColor }}\">{{ g.n }}<\u002Fspan>\n                <span style=\"font-size:12px;font-weight:500;color:#d4d4d4;white-space:nowrap\">{{ g.label }}<\u002Fspan>\n                <div style=\"flex:1\"><\u002Fdiv>\n                <span style=\"font-family:'Geist Mono',monospace;font-size:10px;color:{{ g.progColor }};white-space:nowrap\">{{ g.progress }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          {{ edgeSvg }}\n          <sc-for list=\"{{ nodes }}\" as=\"n\" hint-placeholder-count=\"14\">\n            <div sc-camel-on-mouse-down=\"{{ n.onDown }}\" sc-camel-on-context-menu=\"{{ n.onCtx }}\" sc-camel-on-double-click=\"{{ n.onDbl }}\" style=\"position:absolute;left:{{ n.x }}px;top:{{ n.y }}px;width:184px;height:52px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 8px 0 9px;border-radius:12px;background:{{ n.bg }};border:1px solid {{ n.border }};opacity:{{ n.opacity }};cursor:grab;user-select:none;transition:opacity .2s,background .15s\" style-hover=\"background:#1f1f1f\">\n              <div style=\"width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:{{ n.iconBg }};color:{{ n.iconColor }};box-shadow:{{ n.ring }}\">\n                <sc-if value=\"{{ n.isSource }}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"><ellipse cx=\"8\" cy=\"4\" rx=\"5\" ry=\"2\"><\u002Fellipse><path d=\"M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4\"><\u002Fpath><path d=\"M3 8c0 1.1 2.2 2 5 2s5-.9 5-2\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                <sc-if value=\"{{ n.isRecipe }}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linejoin=\"round\"><path d=\"M8 1.5l5.5 3v7L8 14.5l-5.5-3v-7z\"><\u002Fpath><path d=\"M2.5 4.5L8 7.5l5.5-3M8 7.5v7\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                <sc-if value=\"{{ n.isDecision }}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linejoin=\"round\"><path d=\"M8 1.8L14.2 8 8 14.2 1.8 8z\"><\u002Fpath><path d=\"M6 8h4\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                <sc-if value=\"{{ n.isModel }}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"><circle cx=\"8\" cy=\"8\" r=\"6\"><\u002Fcircle><circle cx=\"8\" cy=\"8\" r=\"3.2\"><\u002Fcircle><circle cx=\"8\" cy=\"8\" r=\"0.9\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg><\u002Fsc-if>\n                <sc-if value=\"{{ n.isAudio }}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\"><path d=\"M2 7v2M4.5 5v6M7 2.5v11M9.5 5v6M12 6.5v3M14.5 7.5v1\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                <sc-if value=\"{{ n.isCustom }}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\"><rect x=\"4\" y=\"4\" width=\"8\" height=\"8\ _db = librosa.amplitude_to_db(S, ref=np.max)\",\n  i2: \"noise_profile = audio[: int(0.5 * sr)]\",\n  cm1: \"import onnxruntime as ort\\n\\nsess = ort.InferenceSession('denoiser.onnx', providers=['CPUExecutionProvider'])\\n\\ndef denoise(audio):\\n    frames = audio.reshape(1, -1).astype('float32')\\n    return sess.run(None, {'audio': frames})[0].squeeze()\",\n  n2: \"import librosa\\n\\naudio = librosa.resample(audio, orig_sr=sr, target_sr=16000)\\nsr = 16000\",\n  n3: \"import webrtcvad\\n\\nvad = webrtcvad.Vad(2)\\nspeech = [f for f in frames(audio, sr, ms=30) if vad.is_speech(f.bytes, sr)]\",\n  ft1: \"mel = librosa.feature.melspectrogram(y=audio, sr=sr, n_mels=80)\\nlogmel = librosa.power_to_db(mel)\",\n  mw: \"import whisper\\n\\nmodel = whisper.load_model('small')\\nresult = model.transcribe(audio, fp16=False)\",\n  e1: \"for f, clean in zip(files, cleaned):\\n    sf.write(out / f.name, clean, sr)\",\n  t1: \"import json\\n\\njson.dump(result['segments'], open(out / f'{f.stem}.json', 'w'), indent=2)\",\n};\nconst CUSTOM_DEFAULT = {\n  cm1: { framework: 'ONNX', file: 'denoiser.onnx', size: '4.2 MB', input: 'audio · float32[1, T] · 16 kHz', output: 'audio · float32[1, T]', device: 'CPU', validated: true },\n};\nconst AA = [['Glu', 1], ['Asp', 3], ['Ala', 4], ['Arg', 6], ['Gly', 5], ['Leu', 8], ['Ile', 9], ['His', 11], ['Lys', 7], ['Ser', 13], ['Thr', 15], ['Val', 12], ['Pro', 18], ['Tyr', 24], ['Cys', 41], ['Met', 29], ['Phe', 22], ['Trp', 57], ['Asn', 63], ['Gln', 48], ['GMP', 71], ['IMP', 66], ['AMP', 74]];\nconst FULL = { Glu: 'glutamate', Asp: 'aspartate', Ala: 'alanine', Arg: 'arginine', Gly: 'glycine', Leu: 'leucine', Ile: 'isoleucine', His: 'histidine', Lys: 'lysine', Ser: 'serine', Thr: 'threonine', Val: 'valine', Pro: 'proline', Tyr: 'tyrosine', Cys: 'cysteine', Met: 'methionine', Phe: 'phenylalanine', Trp: 'tryptophan', Asn: 'asparagine', Gln: 'glutamine', GMP: 'gmp', IMP: 'imp', AMP: 'amp' };\nconst OUTL = { Leu: 34, Ile: 29, His: 31, Asp: 22, Glu: 18, Ala: 12, Arg: 14, Gly: 9, Lys: 11, Ser: 7, Thr: 6, Val: 8, Pro: 10 };\nconst SCORES = {\n  anova: { Glu: 0.96, Asp: 0.88, Arg: 0.61, Ala: 0.58, Gly: 0.4, Leu: 0.52, Ile: 0.34, His: 0.44, Lys: 0.3, Ser: 0.22, Thr: 0.18, Val: 0.27, Pro: 0.36, Phe: 0.2, Tyr: 0.15 },\n  mi: { Glu: 0.92, Asp: 0.81, Arg: 0.7, Ala: 0.49, Gly: 0.55, Leu: 0.38, Ile: 0.29, His: 0.47, Lys: 0.33, Ser: 0.26, Thr: 0.2, Val: 0.24, Pro: 0.41, Phe: 0.18, Tyr: 0.16 },\n  rfe: { Glu: 1, Asp: 0.9, Arg: 0.45, Ala: 0.72, Gly: 0.3, Leu: 0.63, Ile: 0.25, His: 0.5, Lys: 0.2, Ser: 0.35, Thr: 0.15, Val: 0.4, Pro: 0.28, Phe: 0.22, Tyr: 0.12 },\n  lasso: { Glu: 0.89, Asp: 0.84, Arg: 0.57, Ala: 0.31, Gly: 0.48, Leu: 0.42, Ile: 0.05, His: 0.39, Lys: 0.12, Ser: 0.02, Thr: 0.08, Val: 0.18, Pro: 0.33, Phe: 0.06, Tyr: 0.04 },\n};\nconst GROUPS = [['Vegetables', 168], ['Seafood', 112], ['Meat', 86], ['Fruits', 64], ['Seasonings & spices', 58], ['Dairy', 48], ['Beverages', 34], ['Algae', 22], ['Fats & oils', 16]];\nconst METHOD_LABEL = { anova: 'ANOVA', mi: 'Mutual info', rfe: 'RFE', lasso: 'Lasso' };\n\nconst DEFS = {\n  missing: {\n    q: 'How should columns with missing values be handled?', rec: 'drop0',\n    options: [['drop0', 'Drop + fill 0', 'Drop columns above the threshold, fill the rest with 0 (protein absent)'], ['dropMean', 'Drop + fill mean', 'Fill remaining gaps with the column mean'], ['dropMedian', 'Drop + fill median', 'Less sensitive to the extreme Asp and Leu values']],\n    param: { label: 'Drop columns with missing above', min: 5, max: 60, step: 1, def: 20, fmt: v => v + '%' },\n    why: 'The methodology fixes the cut at 20% missing. Above that, columns like Cys, Trp and the nucleotides are mostly empty and add noise. A missing amino acid reading means the protein is absent, so 0 is a faithful fill and, unlike mean or median, it uses no statistics from the test rows.',\n  },\n  outliers: {\n    q: 'How should extreme values be treated?', rec: 'iqr',\n    options: [['iqr', 'IQR fence', 'Remove rows beyond k × IQR. Robust to skewed data'], ['z', 'Z-score > 3', 'Assumes normal distributions'], ['keep', 'Keep all', 'No rows removed']],\n    param: { label: 'IQR multiplier k', min: 1, max: 3, step: 0.1, def: 1.5, fmt: v => '× ' + Number(v).toFixed(1), only: 'iqr' },\n    why: 'Boxplots show aberrant values in leucine, isoleucine and histidine, and aspartate readings above 1,750 that are 10× typical. The distributions are right-skewed, so a z-score rule under-detects them; the IQR fence does not assume normality.',\n  },\n  selection: {\n    q: 'Which feature selection method should run?', rec: 'mi',\n    options: [['anova', 'ANOVA', 'Filter · keeps features whose mean differs by group'], ['mi', 'Mutual information', 'Filter · also detects non-linear relationships'], ['rfe', 'Recursive elimination', 'Wrapper · retrains a model each round, slower'], ['lasso', 'Lasso (L1)', 'Embedded · selection happens during training']],\n    param: { label: 'Features to keep', min: 2, max: 12, step: 1, def: 6, fmt: v => 'top ' + v },\n    why: 'Scatterplots showed relationships that differ by category, including non-linear ones (Fats & oils vary on arginine with aspartate flat). Mutual information captures those at filter-method cost. Compare with RFE on cross-validation before committing.',\n  },\n  dims: {\n    q: 'Does the dataset need dimensionality reduction?', rec: 'skip',\n    options: [['skip', 'Skip', 'Few features relative to rows'], ['pca', 'PCA · 95% variance', 'Compress correlated features into components']],\n    why: 'Reduction helps when features are numerous relative to rows, highly redundant, or training is slow. After selection there are only a handful of features for 608 rows, so PCA would cost interpretability without a clear gain.',\n  },\n  denoise: {\n    q: 'How should background noise be removed?', rec: 'custom',\n    options: [['gate', 'Spectral gating', 'Subtracts the noise profile per band. Fast; strong settings leave artifacts'], ['wiener', 'Wiener filter', 'Statistical and gentle; weak on wind and traffic'], ['rnn', 'RNNoise', 'Pretrained recurrent net, real-time, speech only'], ['custom', 'Custom model', 'Your uploaded model, run in the graph']],\n    param: { label: 'Reduction strength', min: 0, max: 30, step: 1, def: 18, fmt: v => v + ' dB', only: 'gate' },\n    why: 'The recordings carry 50 Hz hum plus non-stationary wind and traffic. Gating and Wiener filtering assume stationary noise, so they either miss the wind or smear speech. The custom model was trained on this kind of field audio and lifts SNR to about 21 dB with the lowest word error rate downstream.',\n  },\n  scaling: {\n    q: 'How should features be rescaled?', rec: 'norm',\n    options: [['norm', 'Normalize (min-max)', 'Scale to [0, 1]. Suited to non-normal data'], ['std', 'Standardize (z-score)', 'Mean 0, std 1. Assumes roughly normal data'], ['none', 'No scaling', 'Only safe for tree-based models']],\n    why: 'Shapiro tests reject normality for the selected features, which the methodology maps to normalization. The scaler is fitted on the training split only, so no test information leaks.',\n  },\n};\nconst INIT_NODES = [\n  ['s1', 'source', 0, 0, 'umami_dataset.csv', 'delimiter \\\\t', '608 rows · 26 cols'],\n  ['x1', 'recipe', 0, 80, 'Profile', 'head · describe · info', 'Nulls in 19 columns'],\n  ['x2', 'view', 0, 160, 'Target balance', 'countplot · group', 'Imbalanced · 9 classes'],\n  ['d1', 'decision', 1, 0, 'Missing values', 'Rule', null, 'missing'],\n  ['c1', 'recipe', 1, 80, 'Drop categoricals', 'name, region', 'Kept target: group'],\n  ['d2', 'decision', 1, 160, 'Outliers', 'Rule', null, 'outliers'],\n  ['f1', 'recipe', 2, 0, 'Correlation filter', 'Pearson |r| > 0.5', '1 redundant removed'],\n  ['d3', 'decision', 2, 80, 'Selection method', 'Rule', null, 'selection'],\n  ['g1', 'recipe', 3, 0, 'Group transform', 'Mean by group', '+2 features'],\n  ['g2', 'decision', 3, 80, 'Reduce dimensions', 'Rule', null, 'dims'],\n  ['sp', 'recipe', 4, 0, 'Train / test split', '80 / 20 · stratified', '486 / 122 rows'],\n  ['d4', 'decision', 4, 80, 'Scaling', 'Rule', null, 'scaling'],\n  ['m1', 'model', 5, 0, 'Random forest', 'Classifier', 'Accuracy 0.84'],\n  ['m2', 'model', 5, 80, 'Logistic regression', 'Linear', 'Accuracy 0.71'],\n].map(([id, kind, col, y, label, sub, note, dtype]) => ({ id, kind, col, x: col * COLW, y, label, sub, note, dtype, status: 'built' }));\nconst INIT_EDGES = [['s1', 'x1'], ['x1', 'x2'], ['x2', 'd1'], ['d1', 'c1'], ['c1', 'd2'], ['d2', 'f1'], ['f1', 'd3'], ['d3', 'g1'], ['g1', 'g2'], ['g2', 'sp'], ['sp', 'd4'], ['d4', 'm1'], ['d4', 'm2']].map(([from, to]) => ({ from, to }));\nconst PROJECTS = {\n  umami: { title: 'Umami taste analysis', sub: 'Methodology flow', meta: 'Tabular · 608 rows · classification', stages: STAGES_UMAMI, nodes: INIT_NODES, edges: INIT_EDGES },\n  audio: { title: 'Field audio cleanup', sub: 'Denoise & transcribe', meta: 'Audio · 212 recordings · custom model', stages: STAGES_AUDIO, nodes: AUDIO_NODES, edges: AUDIO_EDGES },\n};\nconst RUNTIME = { ONNX: 'ONNX Runtime 1.19', PyTorch: 'TorchScript 2.4', 'scikit-learn': 'scikit-learn 1.5', TensorFlow: 'TensorFlow 2.17' };\nconst BASE_CODE = {\n  s1: \"import pandas as pd\\nimport numpy as np\\n\\ndf_taste = pd.read_csv('umami_dataset.csv', delimiter='\\\\t')\",\n  x1: \"display(df_taste.head())\\ndisplay(df_taste.describe())\\ndisplay(df_taste.info())\",\n  x2: \"import seaborn as sns\\n\\nsns.countplot(data=df_taste, y='group')\",\n  c1: \"df_taste = df_taste.drop(columns=['name', 'region'])\",\n  f1: \"corr = df_taste.drop(columns='group').corr().abs()\\nupper = corr.where(np.triu(np.ones(corr.shape), k=1).astype(bool))\\nredundant = [c for c in upper.columns if (upper[c] > 0.5).any()]\\ndf_taste = df_taste.drop(columns=redundant)\",\n  g1: \"for c in ['glutamate', 'aspartate']:\\n    df_taste[f'{c}_group_mean'] = df_taste.groupby('group')[c].transform('mean')\",\n  sp: \"from sklearn.model_selection import train_test_split\\n\\nX = df_taste[selected]\\ny = df_taste['group']\\nX_train, X_test, y_train, y_test = train_test_split(\\n    X, y, test_size=0.2, stratify=y, random_state=42)\",\n  m1: \"from sklearn.ensemble import RandomForestClassifier\\n\\nmodel = RandomForestClassifier(n_estimators=300, random_state=42)\\nmodel.fit(X_train, y_train)\\nprint(model.score(X_test, y_test))\",\n  m2: \"from sklearn.linear_model import LogisticRegression\\n\\nmodel = LogisticRegression(max_iter=1000)\\nmodel.fit(X_train, y_train)\\nprint(model.score(X_test, y_test))\",\n};\nfunction hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }\nfunction rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nfunction now() { const d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(v => String(v).padStart(2, '0')).join(':') + '.' + String(d.getMilliseconds()).padStart(3, '0'); }\nfunction defaultDecision(dtype) { const d = DEFS[dtype]; return { choice: d.rec, param: d.param ? d.param.def : null }; }\nconst STAGE_HUE = ['#4a4a4a', '#636363', '#7e7e7e', '#9c9c9c', '#bfbfbf', '#e8e8e8'];\nconst APPLE_COLS = ['Size', 'Weight', 'Sweetness', 'Crunchiness', 'Juiciness', 'Ripeness', 'Acidity'];\nconst NOTEBOOKS = [\n  { id: 'nb1', title: 'Exploration · umami', stage: 'Explore', cells: [\n    { id: 'a1', type: 'md', title: 'Dataset exploration', src: 'Import the dataset, then check its format and content with head, describe and info.' },\n    { id: 'a2', type: 'code', stage: 0, src: \"import pandas as pd\\nimport numpy as np\\n\\ndf_taste = pd.read_csv('umami_dataset.csv', delimiter='\\\\t')\\ndf_taste.shape\", out: '(608, 26)' },\n    { id: 'a3', type: 'code', stage: 0, src: 'df_taste.info()', out: \"RangeIndex: 608 entries, 0 to 607\\nData columns (total 26 columns):\\n #   Column      Non-Null Count  Dtype\\n 0   name        608 non-null    object\\n 1   region      608 non-null    object\\n 2   group       608 non-null    object\\n 3   glutamate   602 non-null    float64\\n 4   aspartate   590 non-null    float64\\n ...\\n25   amp         158 non-null    float64\" },\n    { id: 'a4', type: 'md', title: 'Missing values', src: 'There is no consensus threshold for dropping a variable. We use 20% here. Fill statistics must be computed after the train/test split to avoid leakage.' },\n    { id: 'a5', type: 'code', stage: 1, src: 'missing = df_taste.isnull().mean()\\nvalues_to_keep = missing[missing <= 0.2].index\\nlen(values_to_keep)', out: '16' },\n  ] },\n  { id: 'nb2', title: 'Feature selection · apple', stage: 'Feature selection', cells: [\n    { id: 'b1', type: 'md', title: 'Filter methods', src: 'Filter methods score each feature with univariate statistics instead of cross-validation. They are fast and cheap on high-dimensional data.' },\n    { id: 'b2', type: 'code', stage: 2, src: \"feat_select = []\\nfor i in X.columns:\\n    lm = ols('{} ~ Quality'.format(i), data=df_apple).fit()\\n    p = anova_lm(lm)['PR(>F)'].iloc[0]\\n    if p <= 0.05:\\n        feat_select.append(i)\\nprint('Features selected:', feat_select)\", out: \"Features selected: ['Size', 'Sweetness', 'Crunchiness', 'Juiciness', 'Ripeness']\" },\n    { id: 'b3', type: 'code', stage: 2, src: 'from sklearn.feature_selection import SelectKBest, chi2\\n\\nkbest = SelectKBest(score_func=chi2, k=3).fit(X, y)\\nkbest.get_feature_names_out()', out: \"array(['Size', 'Sweetness', 'Juiciness'], dtype=object)\" },\n    { id: 'b4', type: 'code', stage: 2, src: 'from sklearn.feature_selection import RFE\\nfrom sklearn.svm import SVR\\n\\nselector = RFE(SVR(kernel=\"linear\"), n_features_to_select=3, step=1).fit(X, y)\\nselector.get_feature_names_out()', out: \"array(['Size', 'Sweetness', 'Ripeness'], dtype=object)\" },\n  ] },\n  { id: 'nb3', title: 'Scaling comparison', stage: 'Split & scale', cells: [\n    { id: 'c1', type: 'md', title: 'Normalize or standardize?', src: 'Non-normal distributions, or a need for a fixed range, point to normalization. Roughly normal data, or algorithms that assume zero mean and unit variance, point to standardization.' },\n    { id: 'c2', type: 'code', stage: 4, src: 'from scipy.stats import shapiro\\n\\n{c: round(shapiro(df_taste[c]).pvalue, 4) for c in selected}', out: \"{'glutamate': 0.0001, 'aspartate': 0.0003, 'arginine': 0.0012, 'alanine': 0.0009}\" },\n    { id: 'c3', type: 'code', stage: 4, src: 'from sklearn.preprocessing import MinMaxScaler\\n\\nscaler = MinMaxScaler().fit(X_train)\\nX_train = scaler.transform(X_train)\\nX_test = scaler.transform(X_test)', out: '' },\n  ] },\n];\nconst snap = (mc, mp, oc, op, sc, sp, scl, model) => ({ miss: { choice: mc, param: mp }, out: { choice: oc, param: op }, sel: { choice: sc, param: sp }, sc: { choice: scl }, model });\nconst INIT_RUNS = [\n  ['r1', 'Oct 9 · 10:12', snap('drop0', 20, 'keep', 1.5, 'anova', 6, 'none', 'LR')],\n  ['r2', 'Oct 10 · 15:40', snap('drop0', 20, 'iqr', 1.5, 'anova', 6, 'std', 'LR')],\n  ['r3', 'Oct 11 · 09:05', snap('dropMean', 20, 'iqr', 1.5, 'mi', 6, 'norm', 'RF')],\n  ['r4', 'Oct 12 · 17:22', snap('drop0', 30, 'iqr', 1.5, 'mi', 8, 'norm', 'RF')],\n  ['r5', 'Oct 13 · 11:48', snap('drop0', 20, 'iqr', 1.5, 'mi', 6, 'norm', 'RF')],\n  ['r6', 'Oct 14 · 16:30', snap('drop0', 20, 'iqr', 1.5, 'rfe', 6, 'norm', 'RF')],\n].map(([id, when, sn]) => ({ id, when, ...sn }));\nfunction metricsFor(r) {\n  let acc = r.model === 'RF' ? 0.84 : 0.71;\n  if (r.out.choice === 'keep') acc -= 0.03; else if (r.out.choice === 'z') acc -= 0.012; else acc -= Math.abs(r.out.param - 1.5) * 0.01;\n  acc += ({ anova: -0.02, mi: 0, rfe: 0.006, lasso: -0.008 })[r.sel.choice] || 0;\n  acc -= Math.abs(r.sel.param - 6) * 0.006 + Math.abs(r.miss.param - 20) * 0.0012;\n  const leak = r.miss.choice !== 'drop0';\n  if (leak) acc += 0.018;\n  if (r.model === 'LR') acc += ({ none: -0.07, std: -0.012, norm: 0 })[r.sc.choice] || 0;\n  const kept = AA.filter(([, m]) => m <= r.miss.param).length;\n  return { acc: +acc.toFixed(3), f1: +(acc - (r.model === 'RF' ? 0.07 : 0.09)).toFixed(3), feats: Math.min(r.sel.param, kept), leak };\n}\nconst runCells = r => [\n  'Drop>' + r.miss.param + '% · ' + ({ drop0: '0', dropMean: 'mean', dropMedian: 'median' })[r.miss.choice],\n  r.out.choice === 'iqr' ? 'IQR ×' + Number(r.out.param).toFixed(1) : r.out.choice === 'z' ? 'Z > 3' : 'Keep',\n  METHOD_LABEL[r.sel.choice] + ' · ' + r.sel.param,\n  ({ norm: 'Min-max', std: 'Z-score', none: 'None' })[r.sc.choice],\n  r.model === 'RF' ? 'Random forest' : 'Logistic reg.',\n];\n\nclass Component extends DCLogic {\n  state = {\n    nodes: INIT_NODES, edges: INIT_EDGES, selected: 'd1', menu: null,\n    pan: { x: 40, y: 80 }, scale: 1, tab: 'main', query: '', running: false, nav: 'Flow', draft: '',\n    decisions: Object.fromEntries(INIT_NODES.filter(n => n.dtype).map(n => [n.id, defaultDecision(n.dtype)])),\n    code: {},\n    project: 'umami', projMenu: false, custom: { ...CUSTOM_DEFAULT },\n    dsSel: 'raw', dsQuery: '',\n    nbSel: 'nb1', notebooks: NOTEBOOKS.map(nb => ({ ...nb, cells: nb.cells.map((c, i) => ({ ...c, orig: c.src, expected: c.out, count: c.type === 'code' && c.out != null ? i : null })) })), execCount: 6,\n    runs: INIT_RUNS, cmp: ['r5', 'r6'], sortAcc: false,\n    dep: { prod: 'r5', staging: 'r6', canary: 10, lat: Array.from({ length: 56 }, (_, i) => 28 + Math.round(12 * Math.abs(Math.sin(i * 1.7)) + (i % 7))), preds: [] },\n    logs: [{ time: '09:14:02.118', text: 'Graph compiled · 6 stages · 14 steps · 5 decisions', tone: 'muted' }, { time: '09:14:02.406', text: 'All decisions set to recommendations from data checks', tone: 'ok' }],\n    chat: [\n      { role: 'ai', text: 'I imported umami_dataset.csv (608 rows, 26 variables) and laid the analysis out in six stages that follow your methodology. Each judgment call is a decision node, pre-set from checks on the data. Change one and every step after it is queued to re-run.' },\n      { role: 'ai', live: 'decisions' },\n    ],\n  };\n  canvasRef = React.createRef();\n  chatRef = React.createRef();\n  cvs = {};\n  refDist = el => { this.cvs.dist = el; };\n  seq = 0;\n\n  componentDidMount() {\n    this.onMove = e => {\n      const d = this.drag; if (!d) return;\n      const dx = e.clientX - d.sx, dy = e.clientY - d.sy;\n      if (Math.abs(dx) + Math.abs(dy) > 3) d.moved = true;\n      if (!d.moved) return;\n      if (d.type === 'node') this.setState(s => ({ nodes: s.nodes.map(n => n.id === d.id ? { ...n, x: Math.max(n.col * COLW - 24, Math.min(n.col * COLW + 24, d.ox + dx / s.scale)), y: d.oy + dy / s.scale } : n) }));\n      else this.setState({ pan: { x: d.ox + dx, y: d.oy + dy } });\n    };\n    this.onUp = () => {\n      const d = this.drag; this.drag = null; if (!d) return;\n      if (!d.moved) this.setState(d.type === 'node' ? { selected: d.id, menu: null, tab: this.state.tab === 'logs' ? 'main' : this.state.tab } : { selected: null, menu: null });\n      else this.forceUpdate();\n    };\n    this.onKey = e => {\n      if (e.key === 'Escape') this.setState({ menu: null });\n      const tag = (e.target.tagName || '').toLowerCase();\n      if ((e.key === 'Delete' || e.key === 'Backspace') && tag !== 'input' && tag !== 'textarea' && this.state.selected) this.remove(this.state.selected);\n    };\n    this.onResize = () => { this._keys = {}; this.forceUpdate(); };\n    window.addEventListener('mousemove', this.onMove);\n    window.addEventListener('mouseup', this.onUp);\n    window.addEventListener('keydown', this.onKey);\n    window.addEventListener('resize', this.onResize);\n    setTimeout(() => this.fit(), 30);\n    this.maybeDraw();\n    const foods = ['shiitake', 'parmesan', 'kombu', 'tomato', 'anchovy', 'soy sauce', 'green tea', 'beef broth', 'nori', 'miso', 'olive oil', 'oyster'];\n    const grpOf = { shiitake: 'Vegetable
