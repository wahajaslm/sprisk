[workspace]
resolver = "3"
members = ["crates/sprisk-artifacts", "crates/sprisk-contracts", "crates/sprisk-core", "crates/sprisk-graph", "crates/sprisk-methodology", "crates/sprisk-registry", "crates/sprisk-store", "crates/sprisk-scheduler", "crates/sprisk-api", "apps/cli"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Full debug info made target/ grow by gigabytes per day. Line tables keep
# backtraces usable at a fraction of the size.
[profile.dev]
debug = "line-tables-only"
