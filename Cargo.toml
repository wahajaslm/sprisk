[workspace]
resolver = "3"
members = ["crates/sprisk-artifacts", "crates/sprisk-contracts", "crates/sprisk-core", "crates/sprisk-graph", "crates/sprisk-registry", "crates/sprisk-store", "crates/sprisk-scheduler"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
