[project]
name = "sprisk-workers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sprisk-contracts",
    "polars>=1.10",
    "pyyaml>=6",
    "jsonschema>=4.23",
    "python-ulid>=3",
    "typer>=0.12",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "skops>=0.16",
]

[project.scripts]
sprisk-worker = "sprisk_workers.__main__:app"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.13", "ruff>=0.8", "types-pyyaml", "types-jsonschema", "types-psutil"]

[tool.uv.sources]
sprisk-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
