[tool.uv.workspace]
members = ["python/sprisk-contracts", "python/sprisk-workers", "plugins/io", "plugins/profile", "plugins/validation", "plugins/ml", "plugins/clean", "plugins/code", "methodology/supervised"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/generated/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "RET"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff.lint.isort]
known-first-party = ["sprisk_*"]

# scikit-learn, skops, pyarrow, pandas and scipy ship no usable type information.
[[tool.mypy.overrides]]
module = ["sklearn.*", "skops.*", "plotly.*", "pyarrow.*", "pandas.*", "scipy.*"]
ignore_missing_imports = true
