[tool.uv.workspace]
members = ["python/sprisk-contracts", "python/sprisk-workers", "plugins/io", "plugins/profile", "plugins/validation", "plugins/ml", "plugins/clean", "plugins/code", "methodology/supervised"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/generated/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "RET"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff.lint.isort]
known-first-party = ["sprisk_*"]

# scikit-learn, skops, pyarrow, pandas, scipy and the audio libraries ship no usable type information.
[[tool.mypy.overrides]]
module = ["sklearn.*", "skops.*", "plotly.*", "pyarrow.*", "pandas.*", "scipy.*", "opensmile.*", "soundfile.*", "webrtcvad.*"]
ignore_missing_imports = true

# Generated enums with a member named `split` (a stage) shadow str.split; the values are right.
[[tool.mypy.overrides]]
module = ["sprisk_contracts.generated.models"]
disable_error_code = ["assignment"]
