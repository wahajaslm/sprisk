schema_version: sprisk.method/v2
id: methodology.common.wrong_types@2.0.0
decides: data.type_repair
name: Type correction
activity: Data types
question: Which text columns are numbers stored as text?
pitfall: Numbers stored as text are treated as categories, one per distinct value.
needs:
  concepts: []
  evidence: [data.number_text]
  decisions: [data.missing_markers]
options:
  # Casting fits nothing, so it runs before the split, after any marking step. It fails on a
  # value that does not read as a number, so a column is cast only when every value does.
  - id: cast
    label: Read as numbers
    description: Casts text columns whose every value reads as a number to numbers, in a step added before the split.
    condition: text column all numbers
    when: every value in a text column reads as a number
    rationale: The values are numbers stored as text, and as text a model treats each one as a category.
    action:
      insert:
        before: split
        operator: sprisk.clean.cast_types@1.0.0
        node_id: wrong_types
        from_evidence: { columns: data.number_text.numbers }
    verify: []
  - id: cast_marked
    label: Read as numbers, placeholders as gaps
    description: Casts text columns to numbers, including those that read as numbers once placeholders are gaps, in a step added before the split.
    condition: numeric only after marking
    when: placeholders were marked, and a column reads as numbers only after that
    rationale: The placeholders are gaps now, so the rest of the column is numbers stored as text.
    action:
      insert:
        before: split
        operator: sprisk.clean.cast_types@1.0.0
        node_id: wrong_types
        from_evidence: { columns: data.number_text.numbers_once_marked }
    verify: []
  - id: keep
    label: Types are right
    description: Leaves the flow as it is. Types stay as read.
    condition: ¬ text column all numbers
    when: no text column reads fully as numbers
    rationale: No text column is numbers stored as text, and codes with leading zeros stay text.
    verify: []
verifications: {}
source: "Breck et al. (2019), Data Validation for Machine Learning, SysML: as text, a model treats each number as its own category."
