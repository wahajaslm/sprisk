schema_version: sprisk.method/v2
id: methodology.common.missing_markers@2.0.0
decides: data.missing_markers
name: Missing value markers
activity: Data types
question: Which placeholder values stand for missing numbers?
pitfall: A '?' or 'n/a' standing for missing turns a number column into text. A model then reads every number as its own category.
needs:
  concepts: []
  evidence: [data.missing_markers]
  decisions: []
options:
  - id: mark
    label: Mark as missing
    description: Turns known placeholder values into gaps in those columns, in a step added before the split.
    when: a mostly numeric column holds a known placeholder
    rationale: The values stand for a gap, so missing is their true meaning.
    action:
      # Marking replaces fixed strings and fits nothing, so it runs before the split.
      insert:
        before: split
        operator: sprisk.clean.mark_missing@1.0.0
        node_id: missing_markers
        from_evidence: { columns: data.missing_markers.columns, values: data.missing_markers.values }
    verify: []
  - id: keep
    label: No markers
    description: Leaves the flow as it is. Values stay as typed.
    when: no mostly numeric column holds a known placeholder
    rationale: There is no placeholder to mark, and a value that may be real, like 'NA', stays.
    verify: []
verifications: {}
source: "Breck et al. (2019), Data Validation for Machine Learning, SysML: a '?' standing for missing turns a number column into text."
