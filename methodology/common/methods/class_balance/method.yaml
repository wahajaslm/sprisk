schema_version: sprisk.method/v2
id: methodology.common.class_balance@2.0.0
decides: question.class_balance
name: Class balance
activity: Target
question: Is the target's class mix unbalanced?
pitfall: Accuracy on a 95/5 target rewards a model that always says the common class. The score then looks good and says little about the rare class.
applies_when: { task: [classification] }
needs:
  concepts: [common.target]
  evidence: [target.shape]
  decisions: []
options:
  - id: balanced
    label: Balanced enough
    description: Records that every class has enough rows. Leaves the flow as it is.
    when: the rarest class holds at least a fifth of an even class's share
    rationale: Each class has enough train rows for plain metrics and splits to work.
    verify: []
  - id: unbalanced
    label: Unbalanced
    description: Records that one class is rare. Leaves the flow as it is.
    when: the rarest class holds under a fifth of an even class's share
    rationale: A class that rare lets a model score well while missing it.
    verify: []
verifications: {}
source: "He & Garcia (2009) Learning from Imbalanced Data, IEEE TKDE 21(9):1263-1284. Unequal error costs are not imbalance: they move the decision threshold (Elkan 2001)."
