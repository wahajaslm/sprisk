schema_version: sprisk.method/v2
id: methodology.common.task_type@2.0.0
decides: question.task_type
name: Task type
activity: Target
question: Does the model predict a class or a number?
pitfall: An integer target read as a number becomes regression when it is really ordered classes or counts. The metric and models then answer a different question.
applies_when: { task: [classification, regression] }
needs:
  concepts: [common.target]
  evidence: [target.shape]
  decisions: []
options:
  - id: classification
    label: Predict a class
    description: Records that the model predicts a class, and checks the labels can be read as classes.
    condition: task = classification
    when: the question says classification
    rationale: The task is the question's, and the check stops a target with one label or decimal values.
    verify: [labels_are_classes]
  - id: regression
    label: Predict a number
    description: Records that the model predicts a number, and checks the target holds numbers.
    condition: task = regression
    when: the question says regression
    rationale: The task is the question's, and the check stops a target that holds text.
    verify: [labels_are_numbers]
verifications:
  labels_are_classes:
    needs: target.shape
    promise: The target's labels can be read as classes.
  labels_are_numbers:
    needs: target.shape
    promise: The target's values are numbers.
source: "Kapoor et al. (2024) REFORMS: Consensus-based recommendations for machine-learning-based science, Science Advances 10(18), module 1: state the task before any result."
