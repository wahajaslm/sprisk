schema_version: sprisk.method/v2
id: methodology.common.join_sources@2.0.0
decides: data.join_sources
name: Source join
activity: Sources
question: Is a loaded table no step reads joined to the rows, and on which column?
pitfall: A one-to-many join quietly copies rows. That changes the unit of prediction and can put copies of one entity in train and test.
needs:
  concepts: [common.event_time]
  evidence: [data.join_keys]
  decisions: []
options:
  - id: single_source
    label: One source
    description: Leaves the flow as it is. No table is joined.
    condition: no lone table ∨ key unclear
    when: no lone unread table, or the key is unclear (asks)
    rationale: No join, no risk; a join that would copy rows or leave gaps goes to a person first.
    verify: []
  - id: join_on_key
    label: Join on the shared key
    description: Joins the unread table on the key column, in a step added before the split.
    condition: 1 match per row on key
    when: every row finds exactly one match on the key
    rationale: A clean many-to-one join keeps the row count and the unit.
    action:
      # A join fits nothing, so it runs before the split; its other table is the one loaded
      # table no step reads.
      insert:
        before: split
        operator: sprisk.io.join@1.0.0
        node_id: join
        from_evidence: { key: data.join_keys.key }
    verify: []
verifications: {}
source: "Kapoor & Narayanan (2023), Patterns 4(9): a join that copies rows or adds what was not known at prediction time leaks; a many-to-one join on a key keeps the unit of prediction."
