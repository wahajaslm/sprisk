schema_version: sprisk.methodology_rule/v1
id: methodology.common.target_definition@1.0.0
name: "Target available, or derived"
stage: question
decides: question.target_definition
status: active
applies_to: [sprisk.io.file_source]
reads: [question.target, question.task]

provenance:
  standard: "Inter-rater agreement for built labels (Cohen 1960; Landis & Koch 1977)"
  citation: "ref-v3 1.2; Cohen (1960) A coefficient of agreement for nominal scales, Educational and Psychological Measurement 20(1):37-46; Landis & Koch (1977) Biometrics 33:159-174; course: knowledge/Sprint_5_-_Machine_learning_24/Methodology_in_Data_Science/methodologie_projet_etape_1_EN.ipynb"
  pitfall: "A label built from a rule can encode the answer, or a proxy for it, and the model then learns the rule, not the outcome. sprisk never makes up a target (rule 8)."
  corner_cases:
    - "No target at all: an exploration, or the unsupervised lane. That is a choice, not a failure."
    - "A guessed target asks before anything depends on it."
    - "Building a label from a rule is not offered yet: no step builds one and checks it against hand labels (kappa at least 0.7, Landis & Koch's 'substantial' band)."

policy_thresholds: {}

alternatives:
  - id: column
    label: "Use the named column"
    description: "The question names the column that holds the outcome."
    rationale: "The plain case: the outcome is recorded."
    action:
      type: pass_through
  - id: no_target
    label: "No target"
    description: "The question explores the data or looks for groups; there is no outcome to predict."
    rationale: "Exploration, clustering and anomaly work need no label. Inventing one would break rule 8."
    action:
      type: pass_through
  - id: derived
    label: "Build the label"
    description: "Build the outcome from a rule, then check it against a sample a person labels."
    rationale: "A built label is a measurement and needs its own check. No step builds one yet."
    action:
      type: emit_methodology_limitation

verification:
  check_id: none
  invariant: "No Gate B check exists yet. Planned: a prediction flow names a confirmed target column."

examples:
  - given: { question.target: churned, question.task: classification }
    picks: column
  - given: { question.task: exploration }
    picks: no_target
  - given: { question.target: { value: churned, origin: inferred }, question.task: classification }
    picks: column
  - given: { question.task: classification }
    picks: column
