schema_version: sprisk.methodology_rule/v1
id: methodology.common.join_sources@1.0.0
name: "Join sources"
stage: data
decides: data.join_sources
status: active
applies_to: [sprisk.validation.random_split, sprisk.validation.group_split, sprisk.validation.temporal_split]
reads: [join.unread_tables, join.rows, join.key.*.matched_rows, join.key.*.most_rows_per_key, question.time_column]

provenance:
  standard: "Data validation for production ML (Polyzotis et al. 2018; Breck et al. 2019)"
  citation: "Polyzotis, Roy, Whang & Zinkevich (2018) Data Lifecycle Challenges in Production Machine Learning, SIGMOD Record 47(2); Breck et al. (2019) Data Validation for Machine Learning, SysML"
  pitfall: "A one-to-many join quietly copies rows, which changes the unit of prediction and can put copies of one entity in train and test."
  corner_cases:
    - "The rows the split reads are the unit of prediction; the other table adds columns to them, such as their labels."
    - "Key values that differ only in type (the number 1 and the text '1') do not match. Match counts are measured before joining."
    - "Every row must find a match: a row that finds none would join with gaps, often a missing label, which a stratified split refuses and which may not be missing at random. A partial match asks."
    - "Only one shared column: any other would clash in the joined table, so several shared columns ask."
    - "A question over time asks: a joined table with values recorded after the prediction time leaks the future."
    - "The key stays in the joined table. The column-roles rule must mark it an identifier so no model uses it; until it is active, nothing stops a sorted row index from predicting the label."
    - "Joins only reshape rows; nothing is fitted, so they run before the split, on all rows."

policy_thresholds: {}

alternatives:
  - id: single_source
    label: "One source"
    description: "Every loaded table is read by a step. Nothing to join."
    rationale: "No join, no risk."
    action:
      type: pass_through

  - id: join_on_key
    label: "Join on the shared key"
    description: "The one column both tables share finds exactly one row of the other table for every row. Join before the split."
    rationale: "A clean many-to-one join keeps the row count and the unit."
    action:
      type: insert_step
      placement: before
      operator: sprisk.io.join@1.0.0
      node_id: join

verification:
  check_id: none
  invariant: "The join operator refuses a key the other table repeats, so it never copies rows. No Gate B check exists yet."

examples:
  - given: { join.unread_tables: 0 }
    picks: single_source
  - given: { join.unread_tables: 1, join.rows: 84916, join.key.unnamed_0.matched_rows: 84916, join.key.unnamed_0.most_rows_per_key: 1 }
    picks: join_on_key
