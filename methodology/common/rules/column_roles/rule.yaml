schema_version: sprisk.methodology_rule/v1
id: methodology.common.column_roles@1.0.0
name: "Column roles"
stage: data
decides: data.column_roles
status: active
applies_to: [sprisk.validation.random_split, sprisk.validation.group_split, sprisk.validation.temporal_split]
reads: [input.rows, input.duplicate_rows, input.column.*.data_type, input.column.*.distinct, input.column.*.word_share, question.target, question.entity_column, question.time_column]

provenance:
  standard: "Schema checks for ML data (Breck et al. 2019)"
  citation: "Breck et al. (2019) Data Validation for Machine Learning, SysML; Kaufman et al. (2012) Leakage in Data Mining, ACM TKDD 6(4)"
  pitfall: "An ID read as a feature lets the model memorise rows; when rows are stored in class order, a row index predicts the label."
  corner_cases:
    - "The role that changes the flow here is the identifier: a whole-number or one-word text column with a different value in every row. It is left out before the split, by a step that fits nothing."
    - "Roles come from structure only (distinct counts, types, words per value), so all rows are measured. Nothing about the target is read."
    - "An all-unique decimal column (amounts, lab values) is a measurement, and an all-unique multi-word text column (titles) is free text; neither is an identifier. Free text is the text-representation rule's."
    - "The target and the question's entity and time columns are never dropped: the group and temporal splits read them (a time column of epoch seconds is unique per row)."
    - "On few rows a column can be unique by chance (ages of 60 people), so it stays; leaving it out is offered for a person to choose."
    - "Codes stored as numbers (postal codes, product type codes) repeat, so they are not identifiers; a number-coded target is the task-type rule's to ask about."
    - "A copied row repeats its identifier, so a column counts as one when its values are as many as the rows that differ; the exact-duplicates rule then removes the copies."
    - "Known limits: a whole-number measurement unique in every row (amounts in cents) is taken for an identifier; a code holding a space (SKU 0001) is taken for free text."
    - "Untrusted text in column names is read as data only."

policy_thresholds:
  # Rows below which a column with a different value in every row may be so by chance.
  # Project convention: with fewer, it stays and leaving it out is only offered.
  min_rows: 100
  # Share of values holding more than one word up to which text is a code, not free text.
  # Project convention: tolerates a few stray spaces in codes.
  max_word_share: 0.05

alternatives:
  - id: drop_identifiers
    label: "Leave identifiers out"
    description: "Keep every column but the identifiers, in a step added before the split."
    rationale: "A unique code per row carries no pattern, only identity."
    action:
      type: insert_step
      placement: before
      operator: sprisk.clean.select_columns@1.0.0
      node_id: identifiers
  - id: keep_all
    label: "No identifiers"
    description: "No column is an identifier, so every column stays."
    rationale: "Nothing to leave out."
    action:
      type: pass_through

verification:
  check_id: none
  invariant: "No Gate B check exists yet. Planned: no model reads a column whose every value is different."

examples:
  - given: { input.rows: 1000, input.column.productid.data_type: Int64, input.column.productid.distinct: 1000, input.column.code.data_type: Int64, input.column.code.distinct: 27, question.target: code }
    picks: drop_identifiers
  - given: { input.rows: 1000, input.column.title.data_type: String, input.column.title.distinct: 1000, input.column.title.word_share: 0.9, input.column.code.data_type: Int64, input.column.code.distinct: 27, question.target: code }
    picks: keep_all
