schema_version: sprisk.methodology_rule/v1
id: methodology.common.objective@1.0.0
name: "Objective and success bar"
stage: question
decides: question.objective
status: active
question: "What is the goal, and what score is good enough?"
applies_to: [sprisk.io.file_source]
reads: [question.objective, question.acceptance_criteria, question.success_bar.metric, question.success_bar.score, question.task]

provenance:
  standard: "CRISP-DM business understanding (Chapman et al. 2000)"
  citation: "Chapman et al. (2000) CRISP-DM 1.0 Step-by-step data mining guide; ref-v3 0.1; course: knowledge/Sprint_5_-_Machine_learning_24/Methodology_in_Data_Science/methodologie_projet_etape_1_EN.ipynb"
  pitfall: "A success bar chosen after seeing scores always looks met. Without one, no result can say the model is good enough, and the loop back has nothing to compare with."
  corner_cases:
    - "The bar is the question's acceptance criteria. Only criteria a person stated or confirmed count: one guessed or measured criterion makes the whole bar ask, since a bar taken from the data is set after the fact."
    - "A guessed exploration asks too, so a guess never skips the bar."
    - "Exploration needs no bar; the report then says none was set."
    - "Decided on the load step, so it is asked once per source, before any run."

policy_thresholds: {}

alternatives:
  - id: stated
    label: "Goal and success bar stated"
    description: "The question states its goal and the score that counts as good enough."
    when: "the question predicts, and a person stated its goal and bar"
    rationale: "Fixing the bar before results keeps the later comparison honest."
    action:
      type: pass_through
  - id: exploration
    label: "Exploration, no bar"
    description: "The question explores the data and predicts nothing, so it has no success bar."
    when: "the question only explores the data"
    rationale: "A bar is for a prediction; an exploration reports what it found."
    action:
      type: pass_through

verification:
  check_id: none
  invariant: "No Gate B check exists yet. Planned: the success bar is recorded before the first cross-validation run."

examples:
  - given: { question.objective: "Flag customers likely to churn", question.acceptance_criteria: "PR-AUC at least 0.4", question.task: classification }
    picks: stated
  - given: { question.objective: "Describe the visits", question.task: exploration }
    picks: exploration
  - given: { question.objective: "Flag customers likely to churn", question.task: classification }
    picks: stated
