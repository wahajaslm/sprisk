schema_version: sprisk.methodology_rule/v1
id: methodology.common.objective@1.0.0
name: "Objective and success bar"
stage: question
decides: question.objective
status: draft

provenance:
  standard: "CRISP-DM business understanding (Chapman et al. 2000)"
  citation: "Chapman et al. (2000) CRISP-DM 1.0 Step-by-step data mining guide; ref-v3 0.1; course: knowledge/Sprint_5_-_Machine_learning_24/Methodology_in_Data_Science/methodologie_projet_etape_1_EN.ipynb"
  pitfall: "A success bar chosen after seeing scores always looks met. Without one, no result can say the model is good enough, and the loop back has nothing to compare with."
  corner_cases:
    - "The goal is stated in money, risk or time, but the score is a model metric. Both are recorded, and the link between them is the person's claim, not a measured one."
    - "Exploration only, no bar: allowed, but the report says no success bar was set."

observes:
  - fact: question.objective
    description: "The goal in the person's units, in their words"
    required: false
  - fact: question.success_bar
    description: "The metric value that counts as good enough"
    required: false

policy_thresholds: {}

alternatives:
  - id: stated
    label: "Record the stated goal and bar"
    description: "The person gave a goal and a success bar before any run. Both are stored on the question."
    condition: "question.objective and question.success_bar are given"
    rationale: "Fixing the bar before results keeps the later comparison honest."
    action:
      type: pass_through

  - id: ask
    label: "Ask for the goal and bar"
    description: "Ask the person what the model is for and which score is good enough. Nothing that compares against the bar runs until then."
    condition: "question.objective or question.success_bar is missing"
    rationale: "Only a person can say what the work is worth. A guessed bar would be fitted to whatever score comes out."
    action:
      type: emit_methodology_limitation
      params:
        reason: "objective_or_success_bar_not_stated"

verification:
  check_id: none
  invariant: "No Gate B check exists yet. Planned: the success bar is recorded before the first cross-validation run."
