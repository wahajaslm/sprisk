schema_version: sprisk.methodology_rule/v1
id: methodology.common.wrong_types@1.0.0
name: "Wrong types"
stage: data
decides: data.type_repair
status: active
question: "Are any text columns really numbers?"
applies_to: [sprisk.validation.random_split, sprisk.validation.group_split, sprisk.validation.temporal_split]
reads: [input.column.*.data_type, input.column.*.numeric_share, input.column.*.leading_zero_values, input.column.*.unconverted]

provenance:
  standard: "Schema checks for ML data (Breck et al. 2019)"
  citation: "Breck et al. (2019) Data Validation for Machine Learning, SysML"
  pitfall: "Numbers stored as text are treated as categories, one per distinct value."
  corner_cases:
    - "Placeholders such as '?' are marked missing first (data.missing_markers); until then the column is not cast, and the values in the way are named."
    - "Numbers written with a comma ('1,000', '2,5') are named, and a person says what the comma means."
    - "Whole numbers become integers. A value with more than 15 digits (an account number) is refused, since a float cannot hold it exactly."
    - "Number codes without leading zeros (ZIP 90210) cannot be told from quantities here; the column-roles rule asks about them."
    - "Codes with leading zeros (postal codes '01234') read as numbers but are labels. They stay text unless a person says otherwise."
    - "Casting fits nothing, so it runs before the split. It fails loudly on any value that does not read as a number."
    - "Dates stored as text are not cast yet."

policy_thresholds:
  # Below this share a column is plain text. Project convention: fewer than half the values
  # reading as numbers means numbers are the exception.
  mixed_min_share: 0.5

alternatives:
  - id: cast
    label: "Read as numbers"
    description: "Text columns whose every present value reads as a number are cast to numbers, in a step added before the split."
    when: "every value in a text column reads as a number, with no leading zeros"
    rationale: "The values are numbers stored as text; as text a model treats each one as a category."
    action:
      type: insert_step
      placement: before
      operator: sprisk.clean.cast_types@1.0.0
      node_id: wrong_types
  - id: keep
    label: "Types are right"
    description: "Leave the columns as they are."
    when: "no text column reads fully as numbers, apart from codes with leading zeros"
    rationale: "No text column is numbers stored as text."
    action:
      type: pass_through

verification:
  check_id: none
  invariant: "No Gate B check exists yet. Planned: each cast column read as numbers in full before the split."

examples:
  - given: { input.column.age.data_type: String, input.column.age.numeric_share: 1.0, input.column.city.data_type: String, input.column.city.numeric_share: 0.0 }
    picks: cast
  - given: { input.column.age.data_type: Int64 }
    picks: keep
  - given: { input.column.zip.data_type: String, input.column.zip.numeric_share: 1.0, input.column.zip.leading_zero_values: 40 }
    picks: keep
  - given: { input.column.age.data_type: String, input.column.age.numeric_share: 0.98, input.column.age.unconverted: ["?"] }
    picks: keep
  - given: { input.column.code.data_type: String, input.column.code.numeric_share: 0.7 }
    picks: keep
