schema_version: sprisk.methodology_rule/v1
id: methodology.common.html_text@1.0.0
name: "HTML in text"
stage: data
decides: data.html_text
status: active
question: "Should HTML tags and entities be stripped from text?"
applies_to: [sprisk.validation.random_split, sprisk.validation.group_split, sprisk.validation.temporal_split]
reads: [question.target, question.entity_column, question.time_column, input.column.*.data_type, input.column.*.distinct, input.column.*.html_share]

provenance:
  standard: "Decode characters and remove markup before tokenising (character sequence decoding)"
  citation: "Manning, Raghavan & Schütze, Introduction to Information Retrieval (2008), §2.1.1: obtaining the character sequence in a document, including character entities such as &amp;"
  pitfall: "Text scraped from web pages keeps its markup. A bag of words counts '<br />' as the word 'br' and splits 'caf&eacute;' from 'café', so the same word gets two features and markup gets its own."
  corner_cases:
    - "Stripping and decoding are fixed functions; they fit nothing, so they run before the split on all rows. Which columns hold HTML is decided on all rows, test rows too: only structure crosses (ADR-0059)."
    - "One value holding HTML is enough: the step changes only the values the measure counts, by the same pattern."
    - "A tag or comment becomes a space, so '2<br />neuf' stays two words; runs of spaces become one. Script and style content is dropped."
    - "Text in angle brackets that starts with a letter ('<Unknown>', 'List<String>') reads as a tag and is removed. Keeping the markup stays on offer for a person who knows the column is not HTML."
    - "'5 < 7', '10<x cm', 'AT&T' and '&copy2020' are not markup and stay: a tag needs its '>', an entity its ';'."
    - "Identifiers are left out before this rule looks, so their word share is measured with markup still in: tags with attributes read as several words, and a wrapped code may pass for free text."
    - "A value that was only markup becomes blank, not missing."
    - "The target, the unit and the time columns are never stripped, even when only guessed: a label or a key is left as it is, and the reason names it."
    - "Only String columns are measured; Categorical or Enum text with HTML is not seen. Nor is a column past the profile's 200-column limit."

policy_thresholds: {}

alternatives:
  - id: strip
    label: "Strip HTML"
    description: "Text columns holding HTML tags or entities are stripped and decoded, in a step added before the split."
    rationale: "Markup is not words; one spelling per word gives a model one signal."
    when: "a feature column, not the target, unit or time column, has values holding HTML"
    action:
      type: insert_step
      placement: before
      operator: sprisk.clean.strip_html@1.0.0
      node_id: html_text
  - id: keep
    label: "Keep the markup"
    description: "Leave the text as it is."
    rationale: "No feature column holds HTML, or what looks like markup is part of the value."
    when: "no feature column holds HTML, or a person keeps the markup"
    action:
      type: pass_through

verification:
  check_id: none
  invariant: "No Gate B check exists yet. Planned: the target column is never in a strip step."

examples:
  - given: { question.target: prdtypecode, input.column.description.data_type: String, input.column.description.distinct: 480, input.column.description.html_share: 0.4 }
    picks: strip
  - given: { question.target: prdtypecode, input.column.description.data_type: String, input.column.description.distinct: 480, input.column.description.html_share: 0.0 }
    picks: keep
  - given: { question.target: label, input.column.label.data_type: String, input.column.label.distinct: 3, input.column.label.html_share: 0.2 }
    picks: keep
