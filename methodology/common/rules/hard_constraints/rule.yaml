schema_version: sprisk.methodology_rule/v1
id: methodology.common.hard_constraints@1.0.0
name: "Hard constraints"
stage: question
decides: question.hard_constraints
status: active
applies_to: [sprisk.ml.linear_model, sprisk.ml.random_forest, sprisk.ml.dummy_baseline]
reads: [question.interpretability]

provenance:
  standard: "Rudin (2019) on interpretable models for high-stakes decisions"
  citation: "ref-v3 0.4; Rudin (2019) Stop explaining black box machine learning models for high stakes decisions and use interpretable models instead, Nature Machine Intelligence 1:206-215"
  pitfall: "Constraints found after model selection throw away the work: a model that wins on score may be one the person cannot use."
  corner_cases:
    - "Only interpretability is asked for yet (high, medium, low). Latency and budget have no rule that reads them; fairness limits belong to the fairness rule."
    - "Decided on the model step, so asking does not hold back the rules before it."
    - "Only a person states a constraint; the question refuses a guessed one."

policy_thresholds: {}

alternatives:
  - id: stated
    label: "Constraints stated"
    description: "The question states how far a person must follow each prediction."
    rationale: "Constraints settle choices before scores are seen."
    action:
      type: pass_through

verification:
  check_id: none
  invariant: "No Gate B check exists yet. Planned: a model outside the stated interpretability level is never selected."

examples:
  - given: { question.interpretability: high }
    picks: stated
  - given: {}
    picks: stated
