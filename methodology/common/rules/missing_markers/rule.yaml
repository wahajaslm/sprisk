schema_version: sprisk.methodology_rule/v1
id: methodology.common.missing_markers@1.0.0
name: "Missing markers"
stage: data
decides: data.missing_markers
status: active
applies_to: [sprisk.validation.random_split, sprisk.validation.group_split, sprisk.validation.temporal_split]
reads: [input.column.*.data_type, input.column.*.numeric_share, input.column.*.unconverted]

provenance:
  standard: "Schema checks for ML data (Breck et al. 2019)"
  citation: "Breck et al. (2019) Data Validation for Machine Learning, SysML"
  pitfall: "A '?' or 'n/a' standing for missing turns a number column into text, so a model reads every number as its own category."
  corner_cases:
    - "'NA' can be a value (Namibia's country code), so it is never marked without a person saying so."
    - "A sentinel like -1 or 999 reads as a number, so it never shows here; the outlier rule sees it."
    - "Marking replaces fixed strings and fits nothing, so it runs before the split, on all rows."
    - "Marking leaves the column as text; the wrong-types rule then reads it as numbers."
    - "Placeholders are matched without the spaces around them (' ?' in UCI Adult) and marked exactly as written."

policy_thresholds:
  # A text column is "numbers with markers" when at least this share of its present values
  # reads as numbers. Project convention: most values are numbers. Kept low because the
  # placeholders count against it: a column with 10% "?" is common (UCI hepatitis, horse colic).
  min_numeric_share: 0.5
  # Most distinct values that do not read as numbers and can still all be markers. Project
  # convention: placeholders are few and repeated; more means a text column or broken data.
  max_marker_values: 5
  # Values marked without asking: common placeholders with no other meaning. Project
  # convention. "NA" is left out on purpose: it is also a country code.
  known_markers: ["?", "-", "--", ".", "", "n/a", "N/A", "null", "NULL", "None", "NaN", "nan", "missing", "unknown"]

alternatives:
  - id: mark
    label: "Mark as missing"
    description: "Placeholder values in mostly numeric text columns become missing, in a step added before the split."
    rationale: "The values stand for a gap, so missing is their true meaning. Only whole values on the known list are marked."
    action:
      type: insert_step
      placement: before
      operator: sprisk.clean.mark_missing@1.0.0
      node_id: missing_markers
  - id: keep
    label: "No markers"
    description: "Leave the values as they are."
    rationale: "No mostly numeric text column holds a known placeholder."
    action:
      type: pass_through

verification:
  check_id: none
  invariant: "No Gate B check exists yet. Planned: the marked values are fixed strings from the known list or named by a person, never learned from the target."

examples:
  - given: { input.column.age.data_type: String, input.column.age.numeric_share: 0.9, input.column.age.unconverted: ["?", "n/a"], input.column.city.data_type: String, input.column.city.numeric_share: 0.0 }
    picks: mark
  - given: { input.column.age.data_type: Int64, input.column.city.data_type: String, input.column.city.numeric_share: 0.0 }
    picks: keep
  - given: { input.column.code.data_type: String, input.column.code.numeric_share: 0.97, input.column.code.unconverted: ["NA"] }
    picks: keep
  - given: { input.column.notes.data_type: String, input.column.notes.numeric_share: 0.3, input.column.notes.unconverted: ["?", "late", "ok"] }
    picks: keep
