schema_version: sprisk.methodology_rule/v1
id: methodology.common.task_type@1.0.0
name: "Task type"
stage: question
decides: question.task_type
status: active
question: "Does the model predict a class or a number?"
applies_to: [sprisk.ml.linear_model, sprisk.ml.random_forest, sprisk.ml.dummy_baseline]
reads: [question.task, step.task, target.data_type, target.distinct]

provenance:
  standard: "REFORMS reporting standard, module 1 (Kapoor et al. 2024)"
  citation: "Kapoor et al. (2024) REFORMS: Consensus-based recommendations for machine-learning-based science, Science Advances 10(18); ref-v3 1.3"
  pitfall: "An integer target read as a number becomes regression when it is really ordered classes or counts, and the metric and models then answer a different question."
  corner_cases:
    - "The type is measured from the target's values on train rows only, never from how features relate to it."
    - "Whole numbers with few values may be classes, ordered grades or counts. The person says which."
    - "A target with one value has nothing to predict."
    - "A stated task that the values contradict (two values, stated as regression) asks."
    - "Multi-label, survival and quantile tasks are not offered yet."

policy_thresholds:
  # Most distinct values a numeric target can have and still be read as classes. Project
  # convention: past this, a numeric target is a quantity. The profile reports a rarest share
  # up to the same count.
  max_classes: 20

alternatives:
  - id: classification
    label: "Classification"
    description: "The model predicts a class."
    when: "the question says so, or the target has 2 values or at most {max_classes} text values"
    rationale: "Two values, or a few named ones, are classes."
    action:
      type: update_estimator_params
      params: { task: "{decision}" }
  - id: regression
    label: "Regression"
    description: "The model predicts a number."
    when: "the question says so, or the target has over {max_classes} numeric values"
    rationale: "Many numeric values are a quantity."
    action:
      type: update_estimator_params
      params: { task: "{decision}" }

verification:
  check_id: none
  invariant: "No Gate B check exists yet. Planned: every model step's task matches the confirmed task type."

examples:
  - given: { question.task: classification, step.task: classification, target.data_type: Int64, target.distinct: 2 }
    picks: classification
  - given: { question.task: regression, step.task: regression, target.data_type: Float64, target.distinct: 300 }
    picks: regression
  - given: { question.task: { value: undetermined, origin: inferred }, target.data_type: Int64, target.distinct: 5 }
    picks: classification
  - given: { question.task: regression, target.data_type: Int64, target.distinct: 2 }
    picks: regression
