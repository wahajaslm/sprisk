schema_version: sprisk.methodology_rule/v1
id: methodology.common.class_balance@1.0.0
name: "Class balance"
stage: question
decides: question.class_balance
status: draft

provenance:
  standard: "He & Garcia (2009) Learning from Imbalanced Data"
  citation: "He & Garcia (2009) IEEE Transactions on Knowledge and Data Engineering 21(9):1263-1284; ref-v3 1.5"
  pitfall: "Accuracy on a 95/5 target rewards a model that always says the common class. Spotting the imbalance early sets the split, metric and model choices that follow."
  corner_cases:
    - "Only for classification targets; a question with no target or a regression target is not applicable."
    - "Measured on all rows only to choose a stratified split. Later rules measure train rows again."
    - "Unequal error costs make the problem unbalanced even when classes are even."

observes:
  - fact: question.task_type
    description: "Binary or multiclass; this rule reads the decided task type"
    required: true
  - profile: target.rarest_class_share
    description: "Share of rows in the rarest class"
    required: true
  - fact: question.costs
    description: "Error costs, when stated"
    required: false

policy_thresholds:
  # Rarest class share below which the target counts as unbalanced. From ref-v3 1.5 (the map
  # row); it is a project default, not a published cut-off: He & Garcia give no single number.
  rarest_class_share: 0.10

alternatives:
  - id: balanced
    label: "Balanced enough"
    description: "Every class has at least the threshold share and costs are equal."
    condition: "target.rarest_class_share >= rarest_class_share AND costs are not stated as unequal"
    rationale: "Plain metrics and splits are fine."
    action:
      type: pass_through

  - id: unbalanced
    label: "Unbalanced"
    description: "Mark the question unbalanced. The split stratifies, the metric avoids accuracy, and the model stage tries imbalance handling."
    condition: "target.rarest_class_share < rarest_class_share OR costs are stated as unequal"
    rationale: "Rare classes or unequal costs change what a good model is."
    action:
      type: pass_through

verification:
  check_id: none
  invariant: "No Gate B check exists yet. The split design check (methodology.supervised.data_split) says itself that it does not check stratification. Planned: an unbalanced classification target is split with stratification, and its class shares match on both sides."
