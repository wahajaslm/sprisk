schema_version: sprisk.methodology_rule/v1
id: methodology.common.unit_of_prediction@1.0.0
name: "Unit of prediction"
stage: question
decides: question.unit_of_prediction
status: active
question: "Does each unit of prediction have one row, or many?"
applies_to: [sprisk.validation.random_split, sprisk.validation.group_split, sprisk.validation.temporal_split]
reads: [question.unit_of_analysis, question.entity_column, input.rows, input.column.*.distinct]

provenance:
  standard: "TRIPOD+AI reporting guideline (Collins et al. 2024)"
  citation: "Collins et al. (2024) TRIPOD+AI statement, BMJ 385:e078378"
  pitfall: "When there are many rows per patient, customer or machine, a row split puts the same entity in train and test. The score then measures memory of the entity, not prediction for a new one."
  corner_cases:
    - "Distinct counts are structure, so they are measured on the rows the split takes, before it."
    - "A unit the person states with no column naming it is taken as one per row, their statement; the reason tells them to name the column if units repeat. A guessed unit asks."
    - "A guessed unit column is still measured, and the rule asks to confirm it."
    - "Rows with no value in the unit column form one group in a group split."
    - "Keeping many rows per unit is allowed, but then the split groups by the unit (split.method decides that)."
    - "Aggregating rows to one per unit is not offered yet: no step aggregates, and one would have to use only rows before the prediction time."

policy_thresholds: {}

alternatives:
  - id: one_row_per_unit
    label: "One row per unit"
    description: "Each unit has one row, so a row split keeps units apart."
    when: "every row has its own unit, or a unit is stated with no column"
    rationale: "The table already matches the question."
    action:
      type: pass_through
  - id: keep_rows_group_split
    label: "Many rows per unit: split by unit"
    description: "Units repeat; keep the rows and let the split group by the unit."
    when: "the unit column has fewer distinct values than rows"
    rationale: "Some questions predict per event. Grouping keeps a unit on one side."
    action:
      type: pass_through
  - id: aggregate
    label: "Aggregate rows to the unit"
    description: "Combine each unit's rows into one before the split."
    when: "never yet: no step combines a unit's rows into one"
    rationale: "One row per unit makes the split and the score mean what the question asks. No step aggregates yet."
    action:
      type: emit_methodology_limitation

verification:
  check_id: methodology.supervised.data_split@1.0.0
  invariant: "Partial: when the question names an entity column, the split design check requires a group split on it. It compares settings only and reads no rows."

examples:
  - given: { question.unit_of_analysis: customer, question.entity_column: customer_id, input.rows: 1000, input.column.customer_id.distinct: 1000 }
    picks: one_row_per_unit
  - given: { question.unit_of_analysis: patient, question.entity_column: patient_id, input.rows: 1000, input.column.patient_id.distinct: 120 }
    picks: keep_rows_group_split
  - given: { question.unit_of_analysis: customer, input.rows: 1000 }
    picks: one_row_per_unit
