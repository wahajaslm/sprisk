schema_version: sprisk.methodology_rule/v1
id: methodology.supervised.interpretability_requirement@1.0.0
name: "Need for interpretability"
stage: models
decides: modeling.interpretability_requirement
status: active
question: "Must a person be able to follow each prediction?"
applies_to: [sprisk.ml.random_forest]
reads: [question.interpretability]

provenance:
  standard: "Rudin (2019) on interpretable models for high-stakes decisions"
  citation: "Rudin (2019) Nature Machine Intelligence 1:206-215; ref-v3 4.4; course: knowledge/Sprint_5_-_Machine_learning_24/Methodology_in_Data_Science/methodologie_projet_etape_4_EN.ipynb"
  pitfall: "Picking a black-box model, then explaining it after the fact, gives explanations that may not match how it decides."
  corner_cases:
    - "A forest cannot be read by a person; with high interpretability it is replaced by a linear model, keeping its target, task, features and costs."
    - "Shallow trees are interpretable too, but no single-tree model is registered yet."
    - "A linear model over hundreds of encoded features is not readable either (Rudin means sparse, simple models); feature selection, not this rule, keeps the features few."
    - "No level stated: the forest stays; the hard-constraints rule asks for the level."
    - "How a chosen model is explained is a separate rule (governance.explainability_framework)."

policy_thresholds: {}

alternatives:
  - id: keep_model
    label: "Keep the forest"
    description: "Interpretability is medium or low, so the forest may stay."
    when: "interpretability is medium, low or not stated"
    rationale: "Accuracy may lead when a person does not need to follow each prediction."
    action:
      type: pass_through
  - id: interpretable_only
    label: "Use a linear model"
    description: "Interpretability is high: the forest is replaced by a linear model a person can read."
    when: "interpretability must be high"
    rationale: "A person must be able to follow each prediction. A linear model's coefficients show how it decides, while its features are few enough to read."
    action:
      type: replace_node
      operator: sprisk.ml.linear_model@3.0.0

verification:
  check_id: none
  invariant: "No Gate B check exists yet. Planned: with high interpretability, no forest is selected."

examples:
  - given: { question.interpretability: high }
    picks: interpretable_only
  - given: { question.interpretability: low }
    picks: keep_model
  - given: {}
    picks: keep_model
