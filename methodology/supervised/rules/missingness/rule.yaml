# ==============================================================================
# Sprisk Methodology Rule: Missingness & Imputation Strategy
# ==============================================================================
schema_version: sprisk.methodology_rule/v1
id: methodology.supervised.missingness@1.0.0
name: "Missing Data Treatment Strategy"
stage: cleaning
decides: cleaning.missingness_strategy

# 1. Scientific Standards & Provenance
# ------------------------------------------------------------------------------
provenance:
  standard: "Google TensorFlow Data Validation (Missingness Invariants) & Scikit-Learn Preprocessing Standards"
  citation: "Little & Rubin (2019) Statistical Analysis with Missing Data (Wiley) & van Buuren (2018) Flexible Imputation of Missing Data (CRC Press)"
  pitfall: "Fitting imputers across the entire dataset before splitting leaks test set statistics into the training partition. Imputing columns with >60% missingness fabricates spurious patterns."
  corner_cases:
    - "Informative Missingness (MNAR): Missing values that signify a business state (e.g. signature_date only populated for closed contracts) carry predictive signal that requires a binary indicator flag."
    - "Extreme Nullness: Columns with >60% null values fabricate more than half the observations if imputed, distorting sample moments."
    - "Target Column Nullness: Imputing values into the target label column is strictly forbidden and invalidates ground truth."

# 2. What This Rule Observes
# ------------------------------------------------------------------------------
observes:
  - profile: column_missingness_rate
    description: "Percentage of null or NaN values per column"
    required: true
  - profile: column_data_type
    description: "Semantic type: quantitative (numerical) vs nominal/categorical"
    required: true
  - profile: column_skewness
    description: "Statistical skewness for numerical variables to differentiate mean vs median"
    required: false
  - fact: question.target
    description: "Target column name (strictly forbidden from synthetic imputation)"
    required: true

# 3. Policy Recommendation Thresholds (Governs automated recommendation)
# ------------------------------------------------------------------------------
policy_thresholds:
  drop_column_threshold: 0.60
  indicator_flag_threshold: 0.20
  skewness_threshold: 1.50

# 4. Methodological Alternatives & Scoped Settings
# ------------------------------------------------------------------------------
alternatives:
  - id: drop_rows
    label: Drop Rows With Missing Values
    description: Remove every row with a gap in these columns, in train and test alike.
    condition: a target column has gaps, OR a column is not numeric
    rationale: A missing target must never be filled. Text columns cannot be imputed yet. Dropping rows
      shrinks the data and can bias it if gaps are not random.
    action:
      type: replace_node
      operator: sprisk.clean.drop_missing@1.0.0
  - id: impute_median
    label: Median Imputation (train rows)
    description: Fill each gap with the column's median over the train rows only.
    condition: column_data_type == 'numerical' AND column_skewness > skewness_threshold
    rationale: Skewed values pull the mean; the median is robust to them. The impute step cannot add a missing-indicator
      column yet, so an informative gap loses that signal.
    action:
      type: replace_node
      operator: sprisk.clean.impute@1.0.0
  - id: impute_mean
    label: Mean Imputation
    description: Fill each gap with the column's mean over the train rows only.
    condition: column_data_type == 'numerical' AND column_skewness <= skewness_threshold
    rationale: For roughly symmetric values. It shrinks variance and weakens correlations, more so as the
      missing share grows.
    action:
      type: replace_node
      operator: sprisk.clean.impute@1.0.0
  - id: impute_mode
    label: Mode / Frequent Category Imputation
    description: Fill missing categorical entries with the most frequent category or an explicit 'missing'
      sentinel category.
    condition: column_data_type in ['nominal', 'categorical'] AND column_missingness_rate < drop_column_threshold
    rationale: 'Not available: the impute step fills numbers only (ADR-0042).'
    action:
      type: replace_node
  - id: drop_column
    label: Drop Column
    description: Exclude the column entirely from the feature matrix.
    condition: column_missingness_rate >= drop_column_threshold
    rationale: 'A column with most values missing carries little signal. Not wired yet: drop it with a select
      step before the split.'
    action:
      type: insert_step
      operator: sprisk.clean.select_columns@1.0.0
      placement: before_split
  - id: pass_through
    label: No Imputation (Native Null Handling)
    description: Preserve null values as-is for tree algorithms with native missing value split handling
      (XGBoost/LightGBM/HistGradientBoosting).
    condition: planned_model_family in ['xgboost', 'lightgbm', 'catboost', 'hist_gradient_boosting'] AND
      column_missingness_rate < drop_column_threshold
    rationale: Tree algorithms natively route missing values to optimal split directions during training.
    action:
      type: pass_through

# 5. Matching Gate B Verification Check
# ------------------------------------------------------------------------------
verification:
  check_id: sprisk.checks.supervised.imputer_leakage@1.0.0
  invariant: "Imputation statistics (mean/median/mode) must be calculated exclusively on the training partition. Target column must never contain imputed values."
