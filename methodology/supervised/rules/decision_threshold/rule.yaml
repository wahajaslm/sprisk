# ==============================================================================
# Sprisk Methodology Rule: Decision Threshold
# ==============================================================================
schema_version: sprisk.methodology_rule/v1
id: methodology.supervised.decision_threshold@1.0.0
name: "Decision Threshold"
stage: evaluation
decides: evaluation.decision_threshold
status: active
question: "At which threshold should a classifier predict the costly class?"
applies_to: [sprisk.ml.linear_model, sprisk.ml.random_forest, sprisk.ml.dummy_baseline]
reads: [question.task, question.time_column, question.entity_column, question.costs.positive, question.costs.false_negative, question.costs.false_positive]

# 1. Scientific Standards & Provenance
# ------------------------------------------------------------------------------
provenance:
  standard: "Elkan (2001) The Foundations of Cost-Sensitive Learning, IJCAI: the threshold that minimises expected cost follows from the misclassification costs, not from 0.5."
  citation: "scikit-learn User Guide §3.3 Tuning the decision threshold for class prediction (TunedThresholdClassifierCV, FixedThresholdClassifier). Hofmann (1994) Statlog (German Credit Data), UCI, doi:10.24432/C5NC77: a cost of 5 for a missed bad credit and 1 for a refused good one."
  pitfall: "A classifier that predicts a class at probability 0.5 treats both mistakes as equally costly. When one mistake costs far more, the most accurate model can be the most expensive one, and can lose more than a constant decision."
  corner_cases:
    - "Only a person knows the costs. A threshold tuned without them optimises an accuracy measure, not the decision."
    - "Tree ensembles do not give calibrated probabilities, so the threshold is tuned on the model's scores rather than computed from the costs."
    - "A threshold tuned on the test rows is chosen on the rows that score it; it is tuned on the training rows only."
    - "Expected cost and the tuned threshold depend on the share of each class in the training rows."

# 2. Policy Recommendation Thresholds
# ------------------------------------------------------------------------------
policy_thresholds: {}

# 3. Methodological Alternatives
# ------------------------------------------------------------------------------
alternatives:
  - id: cost_optimal_threshold
    label: "Cost-Optimal Threshold"
    description: "Each model tunes its decision threshold for the least expected cost on inner folds of its own training rows, and models are compared by expected cost."
    when: "a classification question states each mistake's cost, with no time or entity column"
    rationale: "Stated misclassification costs make one mistake dearer than the other. The threshold that costs least on the training rows reflects that."
    action:
      type: update_estimator_params
      params: { costs: "{decision}" }

  - id: default_half
    label: "Standard 0.5 Threshold"
    description: "The model predicts the class it finds more likely, and models are compared by balanced accuracy."
    when: "the costs are not stated, or a time or entity column is confirmed"
    rationale: "With no stated costs, both mistakes count the same."
    action:
      type: update_estimator_params
      params: { costs: "{decision}" }

# 4. Matching Gate B Verification Check
# ------------------------------------------------------------------------------
verification:
  check_id: supervised.split_leakage@1.0.0
  invariant: "The threshold belongs to the model, so it is tuned on the training rows only; Gate B fails any model that learns from the test rows."

# Examples: run as tests and shown on the Methodology page (ADR-0045)
# ------------------------------------------------------------------------------
examples:
  - given: { question.task: classification, question.costs.positive: bad, question.costs.false_negative: "5.0", question.costs.false_positive: "1.0" }
    picks: cost_optimal_threshold
  - given: { question.task: classification }
    picks: default_half
  - given: { question.task: classification, question.time_column: applied_on, question.costs.positive: bad, question.costs.false_negative: "5.0", question.costs.false_positive: "1.0" }
    picks: default_half
  - given: { question.task: regression }
    picks: default_half
  - given: { question.costs.positive: bad, question.costs.false_negative: "5.0", question.costs.false_positive: "1.0" }
    picks: default_half
