schema_version: sprisk.methodology_rule/v1
id: methodology.supervised.loop_back@1.0.0
name: "Loop back"
stage: evaluation
decides: evaluation.loop_back
status: active
applies_to: [sprisk.ml.linear_model, sprisk.ml.random_forest]
reads: [cv.metric, cv.score, cv.baseline_score, cv.beats_baseline, cv.selected, cv.looks, question.success_bar.metric, question.success_bar.score]

provenance:
  standard: "Cawley & Talbot (2010) on selection bias from reused evaluation data"
  citation: "Cawley & Talbot (2010) JMLR 11:2079-2107; course: knowledge/Sprint_5_-_Machine_learning_24/Methodology_in_Data_Science/methodologie_projet_etape_4_EN.ipynb"
  pitfall: "Looping back on test-row scores turns the test rows into a validation set, and the final score is no longer honest."
  corner_cases:
    - "Only cross-validation results on train rows drive the loop. The test rows are scored once, at the end, and reported."
    - "Beating the baseline is the model selection's own test (corrected repeated k-fold t-test, Holm-adjusted), so this rule and the selection never disagree."
    - "No lift over the baseline stops. Changing the features until the selection's test passes would fish for a lift: each look is a fresh test at the same level."
    - "A model the selection did not choose (another won, or it failed a guardrail) reopens the model choice, never proceeds."
    - "Each look at the same folds makes the cross-validated score more optimistic. Looks across the flow's whole family of versions are counted and capped, and the count is reported."
    - "A chosen model's cross-validated score is optimistic, since it won on these folds. Meeting the bar there is necessary, not proof; the single score on the test rows is the honest number."
    - "A stop is settled in the review: nothing more is done to the flow; its result is reported as it stands."
    - "Each loop is a new flow version; earlier runs stay as they were (sprisk rule 5)."
    - "Which stage to reopen is the features for now. The fit diagnosis and error analysis rules will point at the model or the data instead."

policy_thresholds:
  # Most looks at the same folds before the flow stops and reports. Project convention: a
  # few honest fixes, not a search over the folds (Cawley & Talbot 2010).
  max_looks: 3

alternatives:
  - id: proceed
    label: "Meets the bar: score the test rows once"
    description: "Move on to the single score on the test rows and the report."
    rationale: "The flow is done; the test rows give the honest final number."
    action:
      type: pass_through

  - id: reopen
    label: "Below the bar: reopen the features"
    description: "The chosen model beats the baseline but misses the success bar. Change the features, then compare the models again as a new flow version."
    rationale: "Fix where the weakness is, judged on cross-validation only."
    action:
      type: reopen
      params:
        stage: features

  - id: reopen_models
    label: "Not the chosen model: reopen the model choice"
    description: "The model selection chose another model, or none, since this one lost or failed a guardrail. Choose again."
    rationale: "A model the comparison did not choose has not earned the test rows."
    action:
      type: reopen
      params:
        stage: models

  - id: stop
    label: "No lift, or out of looks: stop and report"
    description: "Report the result as it stands, with the number of looks it took."
    rationale: "Further looping would fit the folds. A null result is a result: it says no lift for these models and features, not that no signal exists."
    action:
      type: emit_methodology_limitation
      params:
        reason: "loop_back_out_of_looks"

verification:
  check_id: none
  invariant: "No Gate B check covers this. split_leakage looks at one flow version only, and loops span versions. Planned: count how often the same test rows were scored across versions; more than once fails."

examples:
  - given: { cv.metric: balanced_accuracy, cv.score: 0.75, cv.baseline_score: 0.5, cv.beats_baseline: "yes", cv.selected: "yes", cv.looks: 1, question.success_bar.metric: balanced_accuracy, question.success_bar.score: "0.7" }
    picks: proceed
  - given: { cv.metric: balanced_accuracy, cv.score: 0.75, cv.baseline_score: 0.5, cv.beats_baseline: "yes", cv.selected: "yes", cv.looks: 1, question.success_bar.metric: balanced_accuracy, question.success_bar.score: "0.8" }
    picks: reopen
  - given: { cv.metric: expected_cost, cv.score: 0.9, cv.baseline_score: 1.0, cv.beats_baseline: "no", cv.selected: "no", cv.looks: 1 }
    picks: stop
  - given: { cv.metric: balanced_accuracy, cv.score: 0.75, cv.baseline_score: 0.5, cv.beats_baseline: "yes", cv.selected: "yes", cv.looks: 3, question.success_bar.metric: balanced_accuracy, question.success_bar.score: "0.8" }
    picks: stop
  - given: { cv.metric: balanced_accuracy, cv.score: 0.75, cv.baseline_score: 0.5, cv.beats_baseline: "yes", cv.selected: "no", cv.looks: 1, question.success_bar.metric: balanced_accuracy, question.success_bar.score: "0.7" }
    picks: reopen_models
  - given: { cv.metric: rmse, cv.score: 4.0, cv.baseline_score: 6.0, cv.beats_baseline: "yes", cv.selected: "yes", cv.looks: 1 }
    picks: proceed
