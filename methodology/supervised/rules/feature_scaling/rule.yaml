# ==============================================================================
# Sprisk Methodology Rule: Numerical Feature Scaling
# ==============================================================================
schema_version: sprisk.methodology_rule/v1
id: methodology.supervised.feature_scaling@2.0.0
name: "Feature Scaling Strategy"
stage: features
decides: features.scaling_strategy

# 1. Scientific Standards & Provenance
# ------------------------------------------------------------------------------
provenance:
  standard: "scikit-learn User Guide: Preprocessing Data (StandardScaler, RobustScaler) and Common Pitfalls"
  citation: "Rousseeuw & Croux (1993) Alternatives to the Median Absolute Deviation (JASA) & Breck et al. (2019) Data Validation for Machine Learning (MLSys)"
  pitfall: "StandardScaler fitted on data with extreme kurtosis/outliers compresses normal variance into a narrow spike. Scaling sparse matrices with centering causes fatal OOM. Recomputing scalers independently in serving introduces training-serving skew."
  corner_cases:
    - "Tree ensembles (RandomForest, XGBoost, LightGBM) are invariant to monotonic transformations; scaling adds compute with zero predictive gain."
    - "Offline-Online Skew: Fitted parameters (mean_, std_, median_, IQR) must be serialized into the ModelPackage artifact so online inference uses the identical normalization."
    - "Centering sparse matrices (with_mean=True) converts zero elements to floats, causing severe memory exhaustion."

# 2. What This Rule Observes
# ------------------------------------------------------------------------------
observes:
  - profile: numerical_columns
    description: "List of continuous quantitative features"
    required: true
  - profile: max_excess_kurtosis
    description: "Peak heavy-tailedness / outlier severity across features"
    required: true
  - profile: is_sparse_matrix
    description: "Whether the input matrix is represented as a sparse matrix"
    required: false
  - profile: iqr
    description: "Per column, the train interquartile range. Zero when most values are equal: such a column is left out of robust scaling, and of max_excess_kurtosis and max_outlier_share, which are 0 when no column is left."
    required: false
  - fact: flow.model_families
    description: "Families of the models seen downstream of the step, from their manifests, sorted and joined by ', ': tree_ensemble, linear, distance_based, density_based; or featureless when none declares one. Absent when no model is seen."
    required: false
  - fact: flow.models_hidden
    description: "Whether all, some or none of the models downstream sit behind a step or model that may change the columns. Absent when no model is downstream."
    required: false
  - fact: flow.models_standardize
    description: "Whether all, some or none of the models downstream standardise their own inputs on the train rows, from their manifests. Absent when no model is downstream."
    required: false

# 3. Policy Recommendation Thresholds (Governs automated recommendation)
# ------------------------------------------------------------------------------
policy_thresholds:
  outlier_kurtosis_threshold: 3.0
  # Share of train values outside the 1.5 x IQR fences; a normal sample has about 0.7%.
  outlier_share_threshold: 0.05

# 4. Methodological Alternatives & Scoped Settings
# ------------------------------------------------------------------------------
alternatives:
  - id: no_scaling
    label: No Scaling Step (Models Downstream Do Not Need It)
    description: Leave the features as they are; scaling here would not change the models downstream.
    condition: (flow.models_standardize == 'all' OR (flow.models_hidden == 'none' AND flow.model_families in ['tree_ensemble', 'featureless']))
    rationale: A model that standardises its inputs on the train rows undoes any earlier affine scaling,
      and trees split on rank order, which scaling keeps. Scaling here adds work with no effect.
    action:
      type: pass_through
  - id: robust_scaling
    label: Robust Scaling (Median & IQR)
    description: Center using the median and scale using the interquartile range (IQR).
    condition: NOT (flow.models_standardize == 'all' OR (flow.models_hidden == 'none' AND flow.model_families in ['tree_ensemble', 'featureless'])) AND (max_excess_kurtosis > outlier_kurtosis_threshold OR max_outlier_share >= outlier_share_threshold)
    rationale: Heavy-tailed distributions detected (excess kurtosis > 3.0). RobustScaler prevents extreme outliers
      from compressing regular feature distances.
    action:
      type: replace_node
      operator: sprisk.clean.scale@1.0.0
  - id: standard_scaling
    label: Standard Scaling (Z-Score Normalization)
    description: Center to zero mean and scale to unit variance.
    condition: NOT (flow.models_standardize == 'all' OR (flow.models_hidden == 'none' AND flow.model_families in ['tree_ensemble', 'featureless'])) AND max_excess_kurtosis <= outlier_kurtosis_threshold AND max_outlier_share < outlier_share_threshold
    rationale: Light tails and few outliers, so the mean and SD describe the spread. It matters for
      models that take their inputs as they are, such as distance-based clustering.
    action:
      type: replace_node
      operator: sprisk.clean.scale@1.0.0
  - id: maxabs_scaling_sparse
    label: MaxAbs Scaling (Sparsity Preserving)
    description: Scale each feature by its maximum absolute value without centering, preserving sparse zero
      structure.
    condition: is_sparse_matrix is true
    rationale: 'Not available: the scale step has no max-abs method.'
    action:
      type: replace_node

# 5. Matching Gate B Verification Check
# ------------------------------------------------------------------------------
verification:
  check_id: sprisk.checks.supervised.scaler_leakage@1.0.0
  invariant: "Mean/std/median/IQR parameters must be computed strictly on the training partition."
