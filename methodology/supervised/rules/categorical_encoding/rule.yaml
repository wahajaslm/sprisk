# ==============================================================================
# Sprisk Methodology Rule: Categorical Encoding Strategy
# ==============================================================================
schema_version: sprisk.methodology_rule/v1
id: methodology.supervised.categorical_encoding@3.0.0
name: "Categorical Encoding Strategy"
stage: features
decides: features.encoding_strategy
status: active
applies_to: [sprisk.ml.linear_model, sprisk.ml.random_forest, sprisk.ml.dummy_baseline]
reads: [step.exclude, step.features, step.task, flow.model_families, column.*.data_type, column.*.distinct]

# 1. Scientific Standards & Provenance
# ------------------------------------------------------------------------------
provenance:
  standard: "Scikit-Learn Category Encoders & CatBoost Categorical Statistics"
  citation: "Micci-Barreca (2001) A Preprocessing Scheme for High-Cardinality Categoricals in Data Mining (ACM SIGKDD) & DoorDash Engineering: Fabricator Declarative Feature Framework (2022)"
  pitfall: "One-hot encoding high-cardinality columns (e.g. 150+ sales channels or zip codes) creates massive sparse matrices, leading to the curse of dimensionality and tree split dilution; target encoding without out-of-fold cross-fitting introduces severe target leakage."
  corner_cases:
    - "Dummy Variable Trap: Linear and logistic regression models suffer perfect multicollinearity if drop='first' is not applied when an intercept exists."
    - "Unseen categories at test time: Encoders without explicit 'handle_unknown' policies crash during production inference."
    - "Rare categories: Low-frequency categories (e.g. <10 instances) need Bayesian smoothing towards the global prior to prevent overfitting."
    - "Ordinal features: Variables with natural sequence (e.g. low/med/high) lose structural ordering if one-hot encoded instead of ordinal-mapped."

# 3. Policy Recommendation Thresholds (Governs automated recommendation)
# ------------------------------------------------------------------------------
policy_thresholds:
  # Most categories a column may have for one 0/1 column each.
  high_cardinality_threshold: 15
  # Fewest values a whole-number column needs before the rule asks whether they are codes.
  min_code_values: 3

# 4. Methodological Alternatives & Scoped Settings
# ------------------------------------------------------------------------------
alternatives:
  - id: one_hot_encoding
    label: "One-Hot Encoding"
    description: "One 0/1 column per category, with the categories the train rows have, in a step added before the model."
    rationale: "Few categories (at most 15): one-hot creates no artificial order and few columns. A category seen only in test rows gets zeros."
    action:
      type: insert_step
      placement: before
      operator: sprisk.clean.encode@1.0.0
      node_id: categories
  - id: leave_out_columns
    label: "Leave Out of the Model"
    description: "The model leaves these text columns out, beside the columns it already leaves out."
    rationale: "Too many categories for one 0/1 column each, and no step turns them into numbers yet. A model that lists its features must have them removed from that list instead."
    action:
      type: update_estimator_params
      params: { exclude: "{decision}" }
  - id: no_encoding
    label: "No Encoding"
    description: "Leave the columns as they are."
    rationale: "Only when every column the model reads is already a number: a model fits only the model and refuses categories (ADR-0056)."
    action:
      type: pass_through
  - id: one_hot_integer_codes
    label: "One-Hot Encoding of Integer Codes"
    description: "One 0/1 column per value of a whole-number column whose values name categories, not amounts."
    rationale: "Whole numbers with a few values (a rate of 1 to 4) may be codes. The data cannot say which, so the rule asks."
    action:
      type: insert_step
      placement: before
      operator: sprisk.clean.encode@1.0.0
      node_id: codes
  - id: target_encoding_oof
    label: "Out-of-Fold Target Encoding with Bayesian Smoothing"
    description: "Encode categories as regularized posterior target expectations using inner cross-validation."
    rationale: "For many categories. Not available: no step for it yet, and it leaks the target without cross-fitting."
    action:
      type: insert_step
      placement: before
      operator: sprisk.features.target_encoder@1.0.0
  - id: ordinal_encoding
    label: "Ordinal / Integer Mapping"
    description: "Map naturally ordered levels (e.g. low/medium/high) to sequential integers [0, 1, 2]."
    rationale: "Only for levels with a real order. Not available: no step for it yet."
    action:
      type: insert_step
      placement: before
      operator: sprisk.features.ordinal_encoder@1.0.0

# 5. Matching Gate B Verification Check
# ------------------------------------------------------------------------------
verification:
  check_id: sprisk.checks.supervised.target_encoding_leakage@1.0.0
  invariant: "Target encoding must use out-of-fold cross-fitting on training folds and never access validation partition labels during category mapping."

# Examples: run as tests and shown on the Methodology page (ADR-0045)
# ------------------------------------------------------------------------------
examples:
  - given: { column.purpose.data_type: String, column.purpose.distinct: 10, column.age.data_type: Int64, column.age.distinct: 53 }
    picks: one_hot_encoding
  - given: { column.age.data_type: Int64, column.age.distinct: 53 }
    picks: no_encoding
  - given: { column.title.data_type: String, column.title.distinct: 8000 }
    picks: leave_out_columns
