# ==============================================================================
# Sprisk Methodology Rule: Rare Categories
# ==============================================================================
schema_version: sprisk.methodology_rule/v1
id: methodology.supervised.rare_categories@1.0.0
name: "Rare Categories"
stage: features
decides: features.rare_categories
status: active
applies_to: [sprisk.ml.linear_model, sprisk.ml.random_forest, sprisk.ml.dummy_baseline]
reads: [rows, column.*.data_type, column.*.distinct]

# 1. Scientific Standards & Provenance
# ------------------------------------------------------------------------------
provenance:
  standard: "scikit-learn OneHotEncoder(min_frequency): infrequent categories grouped into one"
  citation: "scikit-learn User Guide, Preprocessing data: Infrequent categories (OneHotEncoder min_frequency, since 1.1)"
  pitfall: "A category seen a handful of times gives a model almost nothing to learn from, and one 0/1 column each makes too many columns. Shares counted on all rows would let test rows decide what is rare (rule 8)."
  corner_cases:
    - "A category seen only in test rows: it was never learned, so it becomes \"other\"."
    - "A column with its own value for most rows is an identifier: grouping would make it one \"other\" value. It is named, not grouped."
    - "A category already named \"other\" merges with the grouped ones."

# 3. Policy Recommendation Thresholds (Governs automated recommendation)
# ------------------------------------------------------------------------------
policy_thresholds:
  # Most categories one-hot encoding takes (categorical_encoding's limit; a test keeps them
  # equal). Grouping keeps at most this many, counting "other", so encoding then takes it.
  high_cardinality_threshold: 15
  # A category under this share of the train rows becomes "other". Project convention, not a
  # published value: scikit-learn's min_frequency has no default. 1% keeps the categories a
  # cross-validation fold is likely to see.
  min_share: 0.01
  # A column with at least this many distinct values per train row is an identifier. Project
  # convention: at half the rows most values occur once, so a category carries no shared signal.
  identifier_share: 0.5

# 4. Methodological Alternatives & Scoped Settings
# ------------------------------------------------------------------------------
alternatives:
  - id: group_rare
    label: "Group Rare Categories"
    description: "Categories under a share of the train rows become \"other\", and only the most frequent stay, in a step added before the model."
    rationale: "Text with more categories than one-hot takes: grouping keeps at most that many, counting \"other\", so the column can then be one-hot encoded. Counts come from the train rows only."
    action:
      type: insert_step
      placement: before
      operator: sprisk.clean.group_rare@1.0.0
      node_id: rare_categories
  - id: keep_categories
    label: "Keep Categories"
    description: "Leave the categories as they are."
    rationale: "No text column has more categories than one-hot takes, or only an identifier has."
    action:
      type: pass_through

# 5. Matching Gate B Verification Check
# ------------------------------------------------------------------------------
verification:
  check_id: supervised.split_leakage@1.0.0
  invariant: "Category shares are counted on the train rows only; test rows are only mapped, never counted."

# Examples: run as tests and shown on the Methodology page (ADR-0045)
# ------------------------------------------------------------------------------
examples:
  - given: { rows: 750, column.city.data_type: String, column.city.distinct: 120, column.age.data_type: Int64, column.age.distinct: 53 }
    picks: group_rare
  - given: { rows: 750, column.purpose.data_type: String, column.purpose.distinct: 10 }
    picks: keep_categories
  - given: { rows: 750, column.customer.data_type: String, column.customer.distinct: 400 }
    picks: keep_categories
