# ==============================================================================
# Sprisk Methodology Rule: Outlier Treatment & Robustness
# ==============================================================================
schema_version: sprisk.methodology_rule/v1
id: methodology.supervised.outlier_treatment@1.0.0
name: "Outlier Treatment Strategy"
stage: cleaning
decides: cleaning.outlier_strategy

# 1. Scientific Standards & Provenance
# ------------------------------------------------------------------------------
provenance:
  standard: "Tukey (1977) Exploratory Data Analysis & Scikit-Learn Anomaly Detection"
  citation: "Liu, Ting & Zhou (2008) Isolation Forest (IEEE ICDM) & Rousseeuw & Hubert (2011) Robust Statistics for Outlier Detection"
  pitfall: "Dropping outlier rows indiscriminately from the test set conceals tail risk and produces unrealistic accuracy. Uncapped leverage points dominate linear regression gradients."
  corner_cases:
    - "Test partition must NEVER have outliers dropped; real-world production inputs contain anomalous observations."
    - "Monotonic tree models (Random Forest, XGBoost) do not require outlier capping because split thresholds depend only on rank order."
    - "Multivariate anomalies where individual 1D features fall within normal bounds, but joint feature pairs are impossible."

# 2. What This Rule Observes
# ------------------------------------------------------------------------------
observes:
  - profile: outlier_percentage_iqr
    description: "Percentage of data points beyond [Q1 - 1.5*IQR, Q3 + 1.5*IQR]"
    required: true
  - profile: extreme_zscore_max
    description: "Maximum absolute z-score across continuous variables"
    required: true
  - fact: planned_model_family
    description: "Linear/logistic, distance-based, or neural vs tree-based"
    required: false

# 3. Policy Recommendation Thresholds (Governs automated recommendation)
# ------------------------------------------------------------------------------
policy_thresholds:
  outlier_fraction_threshold: 0.05
  extreme_zscore_cutoff: 8.0

# 4. Methodological Alternatives & Scoped Settings
# ------------------------------------------------------------------------------
alternatives:
  - id: none_tree_or_clean
    label: "Retain Outliers (Natural Variation / Tree Invariance)"
    description: "Keep all extreme values without capping or dropping."
    condition: "outlier_percentage_iqr < outlier_fraction_threshold OR planned_model_family in ['random_forest', 'xgboost', 'lightgbm']"
    rationale: "Either outlier rate is within expected natural limits (<5%) or tree models are used, which are immune to univariate leverage."
    action:
      type: pass_through

  - id: winsorize_capping
    label: "Winsorization (Percentile Capping)"
    description: "Cap extreme lower and upper values at training set percentiles (e.g. 1st and 99th)."
    condition: "outlier_percentage_iqr >= outlier_fraction_threshold AND extreme_zscore_max < extreme_zscore_cutoff"
    rationale: "Moderate extreme values present. Percentile capping preserves sample size while eliminating unbounded leverage on gradient updates."
    settings_schema:
      type: object
      properties:
        lower_percentile:
          type: number
          default: 0.01
          minimum: 0.001
          maximum: 0.05
        upper_percentile:
          type: number
          default: 0.99
          minimum: 0.95
          maximum: 0.999
    action:
      type: insert_step
      placement: after_split
      fit_on: train_partition_only
      operator: sprisk.clean.winsorize@1.0.0
      params:
        lower_percentile: "{settings.lower_percentile}"
        upper_percentile: "{settings.upper_percentile}"

  - id: isolation_forest_filter
    label: "Multivariate Isolation Forest (Train Filtering)"
    description: "Identify and filter multi-dimensional anomalies in the training set using random partition isolation trees."
    condition: "outlier_percentage_iqr >= outlier_fraction_threshold AND extreme_zscore_max >= extreme_zscore_cutoff"
    rationale: "Severe, multi-standard-deviation anomalies detected. Multivariate isolation prevents corrupted data collection artifacts from polluting model training."
    settings_schema:
      type: object
      properties:
        contamination:
          type: number
          default: 0.02
          minimum: 0.001
          maximum: 0.10
        random_state:
          type: integer
          default: 42
    action:
      type: insert_step
      placement: after_split
      fit_on: train_partition_only
      apply_to: train_partition_only
      operator: sprisk.clean.isolation_filter@1.0.0
      params:
        contamination: "{settings.contamination}"
        random_state: "{settings.random_state}"

# 5. Matching Gate B Verification Check
# ------------------------------------------------------------------------------
verification:
  check_id: sprisk.checks.supervised.outlier_boundary_leakage@1.0.0
  invariant: "Capping boundaries (quantiles/percentiles) must be estimated on training rows only. Test split rows must never be pruned."
