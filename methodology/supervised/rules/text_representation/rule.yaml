schema_version: sprisk.methodology_rule/v1
id: methodology.supervised.text_representation@1.0.0
name: "Text representation"
stage: features
decides: features.text_representation
status: draft

provenance:
  standard: "scikit-learn 'Text feature extraction' (TF-IDF)"
  citation: "scikit-learn user guide, section 6.2.3 Text feature extraction; ref-v3 3.5; ADR-0058 (proposed)"
  pitfall: "Fitting the vocabulary or IDF weights on all rows lets test words shape the features."
  corner_cases:
    - "The vocabulary and weights are fitted on train rows, inside each fold."
    - "Embeddings run with a local model only. Text never leaves the machine without consent (sprisk rule 6)."
    - "Dataset text is untrusted input (sprisk rule 7); it is turned into numbers, never read as instructions."

observes:
  - profile: column.mean_token_count
    description: "Mean words per value, on train rows"
    required: true

policy_thresholds:
  # Mean words past which text counts as long, where embeddings are tried too. Project
  # convention: about a paragraph. Local sentence-embedding models cut input at about 256-512
  # tokens, so text much longer than that is split into chunks first.
  long_text_tokens: 100

alternatives:
  - id: tfidf_words
    label: "TF-IDF on words"
    description: "Word and word-pair counts, weighted by rarity (ngram_range 1-2)."
    condition: "text column; tried against characters on the same folds"
    rationale: "Strong, cheap baseline for topic-like text. The step needs a new operator (sprisk.clean.tfidf, not built)."
    action:
      type: insert_step
      placement: before_model_fit
      fit_on: train_partition_only
      apply_to: all_partitions
      operator: sprisk.clean.tfidf@1.0.0
      params:
        analyzer: word
        ngram_range: [1, 2]

  - id: tfidf_chars
    label: "TF-IDF on character n-grams"
    description: "Counts of short character runs."
    condition: "text column; tried against words on the same folds"
    rationale: "Handles typos, short codes and word endings better than whole words."
    action:
      type: insert_step
      placement: before_model_fit
      fit_on: train_partition_only
      apply_to: all_partitions
      operator: sprisk.clean.tfidf@1.0.0
      params:
        analyzer: char_wb

  - id: local_embeddings
    label: "Local sentence embeddings"
    description: "A local embedding model turns each value into a vector. Tried only for long or meaning-heavy text."
    condition: "column.mean_token_count > long_text_tokens, or the person says meaning matters more than words"
    rationale: "Counts ignore word order at any length; embeddings keep some meaning, which matters most for long or meaning-heavy text. Not built: ADR-0058 is proposed, and needs an embedding operator (sprisk.clean.embed_text)."
    action:
      type: insert_step
      placement: before_model_fit
      operator: sprisk.clean.embed_text@1.0.0

verification:
  check_id: supervised.split_leakage@1.0.0
  invariant: "The vocabulary is fitted on train rows only. The split leakage check covers this once the TF-IDF operator joins its fitting list."
