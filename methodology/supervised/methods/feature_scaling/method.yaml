schema_version: sprisk.method/v2
id: methodology.supervised.feature_scaling@5.0.0
decides: features.scaling_strategy
name: Feature scaling
activity: Features
question: How are numbers put on one scale before the model?
pitfall: Mean and SD scaling on data with heavy tails squeezes most values into a narrow band. Scaling fit on all rows lets test rows shape the train rows.
applies_when: { task: [classification, regression] }
needs:
  concepts: []
  evidence: [features.scaling]
  # Read for order: skewed numbers are transformed first, then scaled.
  decisions: [features.skew_transform]
options:
  - id: robust_scaling
    label: Robust scaling (median and IQR)
    description: Centres each number on the train rows' median and divides by the IQR, in a step before the model.
    condition: heavy tails ∨ many outliers
    when: a number to scale has heavy tails or many outliers
    rationale: The median and IQR resist outliers that pull the mean and SD.
    action:
      # Fit on the train rows only. It keeps order, so a tree loses nothing.
      insert:
        before: model
        operator: sprisk.clean.scale@1.0.0
        node_id: scaling
        settings: { method: robust }
        from_evidence: { columns: features.scaling.columns }
    verify: []
  - id: z_score_scaling
    label: Z-score scaling (mean and SD)
    description: Centres each number on the train rows' mean and divides by the SD, in a step before the model.
    condition: all tails light
    when: every number to scale has light tails
    rationale: With light tails, the mean and SD describe the spread.
    action:
      insert:
        before: model
        operator: sprisk.clean.scale@1.0.0
        node_id: scaling
        settings: { method: z_score }
        from_evidence: { columns: features.scaling.columns }
    verify: []
  - id: no_scaling
    label: No scaling
    description: Leaves the flow as it is.
    condition: no non-0/1 number varies
    when: no number, other than 0/1, varies enough to scale
    rationale: There is nothing to put on one scale.
    verify: []
verifications: {}
source: "scikit-learn User Guide, Preprocessing data (StandardScaler, RobustScaler); Rousseeuw & Croux (1993), JASA 88(424): median and IQR resist outliers that pull the mean and SD."
