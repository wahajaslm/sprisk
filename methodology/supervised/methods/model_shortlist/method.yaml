schema_version: sprisk.method/v2
id: methodology.supervised.model_shortlist@1.0.0
decides: models.estimator_selection
name: Model shortlist
activity: Models
question: Which models are worth comparing on the same folds?
pitfall: Picking one complex model before measuring hides whether it beats a simple one, or even a naive guess. With few rows, a high-variance model fits noise.
# decide() lets models through; the comparison picks the winner (ADR-0050, ADR-0063 D3).
compare: true
applies_when: { task: [classification, regression] }
needs:
  concepts: []
  evidence: [data.train_rows]
  decisions: []
  statements: [interpretability]
options:
  - id: ml_dummy_baseline
    label: Baseline
    description: Ignores the features and predicts the most frequent class or the mean.
    condition: always
    when: always, as the floor
    rationale: The floor every model must beat on the same folds; a model that does not learned nothing useful.
    action: { replace: { role: model, operator: sprisk.ml.dummy_baseline@3.0.0 } }
    verify: []
  - id: ml_linear_model
    label: Linear model
    description: Logistic regression for classes, linear regression for numbers.
    condition: always
    when: always, as the simple reference
    rationale: Comparing a simple model with more flexible ones shows the bias-variance trade-off on these rows.
    action: { replace: { role: model, operator: sprisk.ml.linear_model@3.0.0 } }
    verify: []
  - id: ml_random_forest
    label: Random forest
    description: Many decision trees, each on a resample of the rows, voting together.
    condition: train rows ≥ 100 ∧ interpretability ≠ high
    when: at least 100 train rows, and a person need not follow each prediction
    rationale: A forest learns interactions a linear model misses, but needs rows enough not to fit noise, and a person cannot follow its predictions.
    action: { replace: { role: model, operator: sprisk.ml.random_forest@3.0.0 } }
    verify: []
verifications: {}
source: "scikit-learn User Guide: Dummy estimators. Hastie, Tibshirani & Friedman (2009), The Elements of Statistical Learning, 2nd ed., §2.9, ch. 7 and ch. 15. Breiman (2001), Random Forests. Rudin (2019), Stop explaining black box models."
