[project]
name = "sprisk-supervised"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sprisk-contracts"]

[dependency-groups]
dev = ["pyyaml>=6", "types-pyyaml"]

[tool.uv.sources]
sprisk-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
