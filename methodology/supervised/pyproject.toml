[project]
name = "sprisk-supervised"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sprisk-contracts", "sprisk-workers", "networkx>=3.3", "python-ulid>=3"]

[dependency-groups]
dev = ["pyyaml>=6", "types-pyyaml", "types-networkx"]

[tool.uv.sources]
sprisk-contracts = { workspace = true }
sprisk-workers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
