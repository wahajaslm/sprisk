# ==============================================================================
# Sprisk Methodology Rule: Cluster Cardinality (Optimal K Determination)
# ==============================================================================
schema_version: sprisk.methodology_rule/v1
id: methodology.unsupervised.cluster_cardinality@1.0.0
name: "Cluster Cardinality & Optimal K Determination"
stage: models
decides: clustering.optimal_k_selection
status: draft

# 1. Scientific Standards & Authoritative Provenance
# ------------------------------------------------------------------------------
provenance:
  standard: "Rousseeuw (1987) Silhouettes: A Graphical Aid to the Interpretation and Validation of Cluster Analysis (JCAM)"
  citation: "Davies & Bouldin (1979) A Cluster Separation Measure (IEEE TPAMI) & Calinski & Harabasz (1974) A Dendrite Method for Cluster Analysis"
  pitfall: "Selecting K arbitrarily or relying solely on the Elbow inertia curve leads to arbitrary clustering. Inertia monotonically decreases towards zero as K approaches N, making it impossible to identify genuine structural stopping points without penalization."
  corner_cases:
    - "Inertia Monotonic Decay: Within-cluster sum of squares strictly decreases with every added cluster, creating an ambiguous smooth curve in complex datasets."
    - "Silhouette K=2 Bias: The silhouette coefficient exhibits a known structural bias favoring K=2 splits; multi-index consensus (Davies-Bouldin + Calinski-Harabasz) is necessary."
    - "Negative Silhouette Cluster Detection: An overall acceptable mean silhouette score (e.g. 0.45) can conceal an entire cluster with negative silhouette coefficients, proving points are closer to neighboring clusters than their own centroid."

# 2. What This Rule Observes
# ------------------------------------------------------------------------------
observes:
  - profile: silhouette_scores_by_k
    description: "Average silhouette coefficient evaluated across candidate K in range [2, 15]"
    required: true
  - profile: davies_bouldin_scores_by_k
    description: "Davies-Bouldin index evaluated across candidate K in range [2, 15]"
    required: true
  - profile: negative_silhouette_fraction_by_k
    description: "Proportion of individual points assigned negative silhouette scores per candidate K"
    required: true
  - fact: planned_clustering_algorithm
    description: "K-Means, Hierarchical, or Gaussian Mixture Model"
    required: true

# 3. Policy Recommendation Thresholds (Governs automated recommendation)
# ------------------------------------------------------------------------------
policy_thresholds:
  min_acceptable_silhouette: 0.35
  max_allowable_negative_silhouette_ratio: 0.05

# 4. Methodological Alternatives & Scoped Settings
# ------------------------------------------------------------------------------
alternatives:
  - id: silhouette_maximization
    label: "Silhouette Analysis Consensus (Maximize Cohesion & Separation)"
    description: "Select K that maximizes the mean silhouette coefficient while enforcing negative silhouette points < 5%."
    condition: "planned_clustering_algorithm in ['kmeans', 'hierarchical']"
    rationale: "Standard mathematical validation. Balances intracluster compactness a(i) against nearest-cluster separation b(i) across candidate K values."
    settings_schema:
      type: object
      properties:
        k_min:
          type: integer
          default: 2
          minimum: 2
          maximum: 5
        k_max:
          type: integer
          default: 10
          minimum: 6
          maximum: 25
    action:
      type: configure_clustering_cardinality
      params:
        criterion: "silhouette"
        k_range: ["{settings.k_min}", "{settings.k_max}"]

  - id: davies_bouldin_minimization
    label: "Davies-Bouldin Index Minimization"
    description: "Select K that minimizes the similarity measure between each cluster and its most similar counterpart."
    condition: "planned_clustering_algorithm in ['kmeans', 'hierarchical']"
    rationale: "Minimizing the ratio of within-cluster scatter to between-cluster separation provides a robust complementary stopping rule to the silhouette curve."
    settings_schema:
      type: object
      properties:
        k_range_max:
          type: integer
          default: 10
    action:
      type: configure_clustering_cardinality
      params:
        criterion: "davies_bouldin"
        max_k: "{settings.k_range_max}"

  - id: bic_model_selection_gmm
    label: "Bayesian Information Criterion (BIC / AIC) for GMM"
    description: "Select K minimizing the BIC score, which penalizes Gaussian mixture likelihood by parameter count (K * D^2)."
    condition: "planned_clustering_algorithm == 'gmm'"
    rationale: "Likelihood-based model selection. BIC incorporates an explicit degrees-of-freedom penalty, preventing overparameterized Gaussian overfitting."
    settings_schema:
      type: object
      properties:
        penalty_type:
          type: string
          enum: ["bic", "aic"]
          default: "bic"
    action:
      type: configure_clustering_cardinality
      params:
        criterion: "{settings.penalty_type}"

# 5. Matching Gate B Verification Check
# ------------------------------------------------------------------------------
verification:
  check_id: sprisk.checks.unsupervised.silhouette_quality@1.0.0
  invariant: "Selecting K resulting in mean silhouette score < 0.25 or with > 15% negative silhouette samples triggers a Gate B WARNING for arbitrary cluster assignment."
