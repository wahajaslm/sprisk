# ==============================================================================
# Sprisk Methodology Rule: Clustering Algorithm Selection
# ==============================================================================
schema_version: sprisk.methodology_rule/v1
id: methodology.unsupervised.clustering_algorithm@1.0.0
name: "Clustering Algorithm Selection"
stage: models
decides: clustering.algorithm_choice

# 1. Scientific Standards & Authoritative Provenance
# ------------------------------------------------------------------------------
provenance:
  standard: "Lloyd (1982) Least Squares Quantization in PCM (K-Means) & Ester et al. (1996) DBSCAN (KDD)"
  citation: "Ward (1963) Hierarchical Grouping to Optimize an Objective Function (JASA) & Dempster, Laird & Rubin (1977) EM Algorithm for Gaussian Mixtures (JRSS-B)"
  pitfall: "Applying K-Means to non-convex, manifold, or varied-density data forcibly breaks natural elongated clusters into artificial spheres and pulls centroids toward isolated noise points. K-Means forces every outlier into a cluster."
  corner_cases:
    - "Arbitrary Manifold Shapes: Concentric rings or crescent-shaped clusters are completely mangled by K-Means; density-based DBSCAN correctly tracks arbitrary topologies."
    - "Outlier Immunity: K-Means has zero outlier tolerance and shifts cluster centers toward extreme anomalies; DBSCAN isolates anomalies into an explicit noise label (-1)."
    - "Soft Membership Uncertainty: Hard partitioning assigns borderline points 100% to one cluster; Gaussian Mixture Models output calibrated posterior probabilities."
    - "Computational Scalability: Hierarchical clustering requires O(N^2) memory and O(N^3) time; it must not be executed on N > 15,000 observations."

# 2. What This Rule Observes
# ------------------------------------------------------------------------------
observes:
  - profile: sample_count
    description: "Number of rows in the dataset"
    required: true
  - profile: presence_of_noise_points
    description: "Whether isolated anomalies exist that should not form clusters"
    required: true
  - fact: expected_cluster_geometry
    description: "Expected geometric topology: spherical/convex vs arbitrary density manifolds"
    required: false
  - fact: soft_clustering_required
    description: "Whether probabilistic soft assignment weights are needed rather than hard labels"
    required: false

# 3. Policy Recommendation Thresholds (Governs automated recommendation)
# ------------------------------------------------------------------------------
policy_thresholds:
  hierarchical_max_samples: 10000
  large_dataset_kmeans_cutoff: 50000
  # Defaults, not measurements: the cluster count and neighbourhood rules check them.
  n_clusters: 3
  n_init: 10
  max_iter: 300
  seed: 42
  eps: 0.5
  min_samples: 5
  covariance_type: full

# 4. Methodological Alternatives & Scoped Settings
# ------------------------------------------------------------------------------
alternatives:
  - id: kmeans_centroid_clustering
    label: "K-Means++ Centroid Clustering"
    description: "Partition observations into K convex Voronoi cells minimizing within-cluster sum of squares (inertia)."
    condition: "presence_of_noise_points is false AND soft_clustering_required is false AND expected_cluster_geometry != 'non_convex'"
    rationale: "Data exhibits compact spherical clusters without extreme background noise. Fast O(NK) convergence with K-Means++ smart seeding."
    settings_schema:
      type: object
      properties:
        n_clusters:
          type: integer
          default: 3
          minimum: 2
          maximum: 50
        n_init:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
        max_iter:
          type: integer
          default: 300
    action:
      type: replace_node
      operator: sprisk.clustering.kmeans@1.0.0

  - id: dbscan_density_clustering
    label: "DBSCAN Density-Based Spatial Clustering"
    description: "Discover arbitrary non-convex clusters based on local density reachability and isolate noise points into label -1."
    condition: "expected_cluster_geometry == 'non_convex' OR presence_of_noise_points is true"
    rationale: "Non-spherical geometries or noisy background detected. DBSCAN discovers arbitrary shapes without requiring pre-specified K and segregates anomalies."
    settings_schema:
      type: object
      properties:
        eps:
          type: number
          default: 0.5
          minimum: 0.01
          maximum: 10.0
          description: "Maximum distance between two samples for one to be considered in the neighborhood of the other."
        min_samples:
          type: integer
          default: 5
          minimum: 2
          maximum: 100
          description: "Number of samples in a neighborhood for a point to be considered a core point."
    action:
      type: replace_node
      operator: sprisk.clustering.dbscan@1.0.0

  - id: hierarchical_agglomerative
    label: "Hierarchical Agglomerative Clustering (Ward Linkage)"
    description: "Bottom-up recursive pairwise cluster merging generating a dendrogram hierarchy."
    condition: "sample_count <= hierarchical_max_samples AND expected_cluster_geometry == 'hierarchical'"
    rationale: "Small-to-moderate sample size with nested taxonomy. Ward linkage minimizes variance growth across merge steps without random initialization dependence."
    settings_schema:
      type: object
      properties:
        n_clusters:
          type: integer
          default: 3
          minimum: 2
          maximum: 20
        linkage:
          type: string
          enum: ["ward", "complete", "average"]
          default: "ward"
    action:
      type: replace_node
      operator: sprisk.clustering.hierarchical@1.0.0

  - id: gaussian_mixture_models
    label: "Gaussian Mixture Models (EM Soft Probabilities)"
    description: "Fit a mixture of K multivariate Gaussian distributions outputting probabilistic cluster memberships."
    condition: "soft_clustering_required is true"
    rationale: "Soft uncertainty required. EM algorithm estimates full covariance matrices, capturing elliptical clusters with differing orientations and volumes."
    settings_schema:
      type: object
      properties:
        n_components:
          type: integer
          default: 3
          minimum: 2
          maximum: 30
        covariance_type:
          type: string
          enum: ["full", "tied", "diag", "spherical"]
          default: "full"
    action:
      type: replace_node
      operator: sprisk.clustering.gmm@1.0.0

# 5. Matching Gate B Verification Check
# ------------------------------------------------------------------------------
verification:
  check_id: sprisk.checks.unsupervised.algorithm_compatibility@1.0.0
  invariant: "Hierarchical agglomerative clustering requested on datasets with N > 25,000 observations causes Gate B FAIL due to quadratic memory exhaustion."
