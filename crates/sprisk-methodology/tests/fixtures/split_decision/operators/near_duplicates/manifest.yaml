schema_version: sprisk.operator/v1
id: sprisk.diagnose.near_duplicates@1.0.0
capability_class: analyzer
entrypoint: sprisk_diagnose.near_duplicates:run
scope: all
attach: { role: split, side: input }
concepts: { title_column: core.item_title }
produces:
  data.near_duplicate_groups:
    fields: { rows: integer, groups: integer, rows_in_groups: integer, largest_group: integer }
inputs: [{ name: data, kind: table }]
outputs: [{ name: evidence, kind: report }]
params_schema: { type: object, additionalProperties: false, required: [title_column], properties: { title_column: { type: string, minLength: 1 } } }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 512, gpu: none, timeout_seconds: 60 }
