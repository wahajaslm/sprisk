schema_version: sprisk.method/v1
id: methodology.core.split_method@1.0.0
decides: evaluation.split_method
activity: Fair evaluation
question: How are rows divided into training and test so the score is fair?
applies_when: { task: [classification, regression] }
needs:
  concepts: [common.target]
  evidence: []
  decisions: [data.repeated_items]
options:
  - id: item_groups
    label: Keep each item's rows on one side
    action:
      replace:
        role: split
        operator: sprisk.validation.group_split@1.0.0
        concepts: { group_column: common.item_identity }
        settings: { test_fraction: 0.2, seed: 42 }
    verify: [no_group_overlap]
  - id: stratified_random
    label: Random rows, with class shares kept
    action:
      replace:
        role: split
        operator: sprisk.validation.random_split@1.0.0
        concepts: { stratify: common.target }
        settings: { test_fraction: 0.2, seed: 42 }
    verify: [class_shares_kept]
  - id: simple_random
    label: Random rows
    action:
      replace:
        role: split
        operator: sprisk.validation.random_split@1.0.0
        settings: { test_fraction: 0.2, seed: 42 }
    verify: []
verifications:
  no_group_overlap:
    needs: evaluation.group_overlap
    promise: No item has rows in both train and test.
  class_shares_kept:
    needs: evaluation.class_shares
    promise: Each class has about the same share of rows in train and test.
    # Project convention, not a published bar: a few points of drift on a 20% test side.
    settings: { max_gap: 0.05 }
source: "scikit-learn User Guide §3.1: GroupShuffleSplit; train_test_split(stratify=y)."
