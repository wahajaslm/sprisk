# ==============================================================================
# Sprisk Methodology Rule: Outlier Treatment & Robustness
# ==============================================================================
schema_version: sprisk.methodology_rule/v1
id: methodology.supervised.outlier_treatment@2.0.0
name: "Outlier Treatment Strategy"
stage: cleaning
decides: cleaning.outlier_strategy
status: active
question: "Should extreme values be clipped?"
applies_to: [sprisk.clean.clip_outliers]
reads: [flow.model_families, flow.models_hidden, flow.other_readers, question.target, question.task, column.*.data_type, column.*.outlier_share, column.*.iqr]

# 1. Scientific Standards & Provenance
# ------------------------------------------------------------------------------
provenance:
  standard: "Tukey (1977) Exploratory Data Analysis & Scikit-Learn Anomaly Detection"
  citation: "Liu, Ting & Zhou (2008) Isolation Forest (IEEE ICDM) & Rousseeuw & Hubert (2011) Robust Statistics for Outlier Detection"
  pitfall: "Dropping outlier rows indiscriminately from the test set conceals tail risk and produces unrealistic accuracy. Uncapped leverage points dominate linear regression gradients."
  corner_cases:
    - "Test partition must NEVER have outliers dropped; real-world production inputs contain anomalous observations."
    - "Monotonic tree models (Random Forest, XGBoost) do not require outlier capping because split thresholds depend only on rank order."
    - "Multivariate anomalies where individual 1D features fall within normal bounds, but joint feature pairs are impossible."

# 3. Policy Recommendation Thresholds (Governs automated recommendation)
# ------------------------------------------------------------------------------
policy_thresholds:
  outlier_fraction_threshold: 0.05
  clip_k: 3.0

# 4. Methodological Alternatives & Scoped Settings
# ------------------------------------------------------------------------------
alternatives:
  - id: none_tree_or_clean
    label: Retain Outliers (Natural Variation / Tree Invariance)
    description: Keep all extreme values without capping or dropping.
    when: few outliers, or no model downstream is pulled by them
    rationale: The outlier rate is within natural limits, or the models downstream are not pulled by
      outlying features. Trees split on rank order; DBSCAN marks isolated rows as noise, and clipping
      would pile them onto the fence; a dummy baseline ignores its features. Outliers in a regression
      target still pull squared-error fits, trees included.
    action:
      type: remove_node
  - id: clip_iqr_fence
    label: Clip to the Train IQR Fences
    description: Cap each feature value at the train fences Q1 - k IQR and Q3 + k IQR. The target, and any column with a zero IQR, are left as they are.
    when: at least a {outlier_fraction_threshold} share of a column's values are outliers, and a model is pulled
    rationale: Limits extreme leverage points without dropping rows. The fences come from the train
      quartiles, which outliers barely move, so the cap does not drift with the values it caps.
    action:
      type: replace_node
      operator: sprisk.clean.clip_outliers@1.0.0
  - id: isolation_forest_filter
    label: Multivariate Isolation Forest (Train Filtering)
    description: Identify and filter multi-dimensional anomalies in the training set using random partition
      isolation trees.
    when: never yet, since no step does this
    rationale: 'Not available: no isolation forest filter operator exists.'
    action:
      type: insert_step

# 5. Matching Gate B Verification Check
# ------------------------------------------------------------------------------
verification:
  check_id: sprisk.checks.supervised.outlier_boundary_leakage@1.0.0
  invariant: "Capping boundaries (quantiles/percentiles) must be estimated on training rows only. Test split rows must never be pruned."

# Examples: run as tests and shown on the Methodology page (ADR-0045)
# ------------------------------------------------------------------------------
examples:
  - given: { column.income.data_type: Float64, column.income.outlier_share: 0.2, column.income.iqr: 5.0 }
    picks: clip_iqr_fence
  - given: { column.age.data_type: Float64, column.age.outlier_share: 0.01, column.age.iqr: 3.0 }
    picks: none_tree_or_clean
  - given: { flow.model_families: tree_ensemble, flow.models_hidden: none, column.income.data_type: Float64, column.income.outlier_share: 0.2, column.income.iqr: 5.0 }
    picks: none_tree_or_clean
