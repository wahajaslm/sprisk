[package]
name = "sprisk-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = "1.0.229"
serde_json = "1.0.154"
sprisk-contracts = { path = "../sprisk-contracts" }
sprisk-core = { path = "../sprisk-core" }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
serde = "1.0.229"
tokio = { version = "1.53.3", features = ["macros", "rt"] }
