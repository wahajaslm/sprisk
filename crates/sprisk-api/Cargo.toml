[package]
name = "sprisk-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
sprisk-artifacts = { path = "../sprisk-artifacts" }
sprisk-contracts = { path = "../sprisk-contracts" }
sprisk-core = { path = "../sprisk-core" }
sprisk-graph = { path = "../sprisk-graph" }
sprisk-registry = { path = "../sprisk-registry" }
sprisk-scheduler = { path = "../sprisk-scheduler" }
sprisk-store = { path = "../sprisk-store" }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "process", "io-util", "time", "macros", "sync"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1"
ulid = "1"

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
