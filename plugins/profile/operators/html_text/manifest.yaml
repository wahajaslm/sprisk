schema_version: sprisk.operator/v1
id: sprisk.profile.html_text@1.0.0
title: HTML in text
capability_class: analyzer
stage: explore
description: Names the text columns whose values hold HTML tags or entities (ADR-0063).
entrypoint: sprisk_profile.html_text:html_text
# Every row, before the split: it reads text structure, never the label's values.
scope: all
attach: { role: split, side: input }
# Each is filled when a binding names it, and left out otherwise.
concepts: { target: common.target, item: common.item_identity, time: common.event_time }
produces:
  data.html_text:
    fields: { columns: string_list, held: string_list }
inputs: [{ name: data, kind: table }]
outputs: [{ name: evidence, kind: report }]
params_schema:
  type: object
  additionalProperties: false
  properties:
    target: { type: string, minLength: 1, x-sprisk-column: true, x-sprisk-excluded: true, description: "The target column, dropped before the step runs: never read, never stripped." }
    item: { type: string, minLength: 1, x-sprisk-column: true, description: "The item column, held as it is." }
    time: { type: string, minLength: 1, x-sprisk-column: true, description: "The time column, held as it is." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
