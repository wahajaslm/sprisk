schema_version: sprisk.operator/v1
id: sprisk.profile.model_inputs@1.0.0
title: Model inputs
capability_class: analyzer
description: Names what the columns a model learns from are, on its train rows - free text, dates, categories to group or encode, gaps to fill (ADR-0063).
entrypoint: sprisk_profile.model_inputs:model_inputs
# The model's train rows only.
scope: train
attach: { role: model, side: input }
concepts: { target: common.target }
produces:
  features.free_text:
    fields: { columns: string_list, categories: string_list, empty: string_list }
  features.dates:
    fields: { columns: string_list }
  features.categories:
    fields: { grouped: string_list, identifiers: string_list }
  features.gaps:
    fields: { columns: string_list, method: string, mostly_empty: string_list, unfillable: string_list }
  features.encoding:
    fields: { few: string_list, many: string_list, codes: string_list }
inputs: [{ name: train, kind: table }]
outputs: [{ name: evidence, kind: report }]
params_schema:
  type: object
  additionalProperties: false
  # Without a bound target the step cannot hold it out, so it is not placed.
  required: [target]
  properties:
    target: { type: string, minLength: 1, x-sprisk-column: true, x-sprisk-excluded: true, description: "The target column, dropped before the step runs: it is not an input." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
