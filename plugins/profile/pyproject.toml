[project]
name = "sprisk-profile"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sprisk-workers",
    "duckdb>=1.1",
    "numpy>=2",
    "plotly>=5.24",
    "great-expectations>=1.24,<2",
]

[tool.uv.sources]
sprisk-workers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
