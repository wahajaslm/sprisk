schema_version: sprisk.operator/v1
id: sprisk.validation.temporal_split@1.0.0
title: Temporal split
capability_class: transform
stage: split
role: split
folds: time
description: Split by time. Every train row is strictly earlier than every test row.
entrypoint: sprisk_validation.temporal_split:temporal_split
notebook_code: sprisk_validation.temporal_split:as_code
inputs: [{ name: data, kind: table }]
outputs: [{ name: train, kind: table }, { name: test, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [time_column, test_fraction]
  properties:
    time_column: { type: string, minLength: 1, description: "Rows are ordered by this column; the latest rows become the test set." }
    test_fraction: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: "Share of the latest rows held out for testing." }
    group_column: { type: string, minLength: 1, description: "Entity identifier. Train drops every entity that also appears in test, so none is on both sides." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
