schema_version: sprisk.operator/v1
id: sprisk.validation.random_split@1.0.0
title: Random split
capability_class: transform
role: split
description: Shuffle rows with a fixed seed into train and test.
entrypoint: sprisk_validation.random_split:random_split
notebook_code: sprisk_validation.random_split:as_code
inputs: [{ name: data, kind: table }]
outputs: [{ name: train, kind: table }, { name: test, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [test_fraction, seed]
  properties:
    test_fraction: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: "Share of rows held out for testing." }
    seed: { type: integer, minimum: 0, description: "Fixes the shuffle so runs repeat." }
    stratify: { type: string, minLength: 1, description: "Keep each class of this column at the same share in train and test. Use the target for classification." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
