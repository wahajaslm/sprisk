schema_version: sprisk.operator/v1
id: sprisk.ml.evaluate@2.1.0
title: Test-set evaluation
capability_class: evaluator
stage: evaluate
role: score
role_default: true
description: Score a fitted model on a test table. Classification - accuracy, balanced accuracy, macro F1. Regression - RMSE, MAE, R2.
entrypoint: sprisk_ml.evaluate:evaluate
notebook_code: sprisk_ml.evaluate:as_code
inputs: [{ name: model, kind: model }, { name: test, kind: table }, { name: words, kind: matrix, optional: true, description: "Word features of the test rows, from the Vectorize text step the model's train words came from; scored beside the test table (ADR-0058)." }]
outputs: [{ name: metrics, kind: metrics }, { name: figures, kind: figure }]
params_schema:
  type: object
  additionalProperties: false
  required: [target, task]
  properties:
    target: { type: string, minLength: 1, description: "Column with the true values in the test table." }
    task: { type: string, enum: [classification, regression], description: "Must match the model's task." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
