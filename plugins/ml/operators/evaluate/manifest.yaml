schema_version: sprisk.operator/v1
id: sprisk.ml.evaluate@1.0.0
capability_class: evaluator
description: Score a fitted model on a test table. Classification - accuracy, balanced accuracy, macro F1. Regression - RMSE, MAE, R2.
entrypoint: sprisk_ml.evaluate:evaluate
inputs: [{ name: model, kind: model }, { name: test, kind: table }]
outputs: [{ name: metrics, kind: metrics }]
params_schema:
  type: object
  additionalProperties: false
  required: [target, task]
  properties:
    target: { type: string, minLength: 1 }
    task: { type: string, enum: [classification, regression] }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
