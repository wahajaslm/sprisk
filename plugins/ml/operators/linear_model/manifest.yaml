schema_version: sprisk.operator/v1
id: sprisk.ml.linear_model@3.0.0
title: Linear model
capability_class: estimator
role: model
model: { family: linear, tasks: [classification, regression], estimator: "sprisk_ml.models:linear_model_estimator", complexity: 1 }
description: Logistic (classification) or linear (regression) regression. It fits only the model; Clean steps before it encode text, fill gaps and scale.
entrypoint: sprisk_ml.models:linear_model
notebook_code: sprisk_ml.models:linear_model_as_code
inputs: [{ name: train, kind: table }, { name: words, kind: matrix, optional: true, description: "Word features of the train rows (Vectorize text), fit beside the table's numbers (ADR-0058)." }]
outputs: [{ name: model, kind: model }]
params_schema:
  type: object
  additionalProperties: false
  required: [target, task]
  properties:
    target: { type: string, minLength: 1, description: "Column to predict." }
    features: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true, description: "Columns used as inputs, all numbers with no gaps. Unset: every column but the target and the excluded ones." }
    exclude: { type: array, items: { type: string, minLength: 1 }, uniqueItems: true, description: "Columns that identify rows, groups or time: never inputs, even when features is unset." }
    task: { type: string, enum: [classification, regression], description: "classification fits logistic regression; regression fits linear regression." }
    costs:
      type: object
      additionalProperties: false
      required: [positive, false_negative, false_positive]
      description: "Misclassification costs of a two-class model (ADR-0053). With them, the model predicts by the cut-off that costs least on its own training rows."
      properties:
        positive: { type: string, minLength: 1, description: "The class whose miss costs, as text." }
        false_negative: { type: number, exclusiveMinimum: 0, description: "Cost of missing a `positive` row." }
        false_positive: { type: number, exclusiveMinimum: 0, description: "Cost of predicting `positive` for another row." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
