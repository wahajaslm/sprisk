schema_version: sprisk.operator/v1
id: sprisk.ml.linear_model@1.0.0
capability_class: estimator
model: { family: linear, tasks: [classification, regression], prepares: [fill_gaps, standardize], estimator: "sprisk_ml.models:linear_model_estimator", complexity: 1 }
description: Logistic (classification) or linear (regression) regression with imputation, scaling and one-hot encoding fit on train only.
entrypoint: sprisk_ml.models:linear_model
inputs: [{ name: train, kind: table }]
outputs: [{ name: model, kind: model }]
params_schema:
  type: object
  additionalProperties: false
  required: [target, features, task]
  properties:
    target: { type: string, minLength: 1, description: "Column to predict." }
    features: { type: array, items: { type: string, minLength: 1 }, uniqueItems: true, description: "Columns used as inputs." }
    task: { type: string, enum: [classification, regression], description: "classification fits logistic regression; regression fits linear regression." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
