schema_version: sprisk.operator/v1
id: sprisk.ml.dummy_baseline@1.0.0
capability_class: estimator
model: { prepares: [fill_gaps, standardize] }
description: Majority class or mean predictor. The floor every model must beat.
entrypoint: sprisk_ml.models:dummy_baseline
inputs: [{ name: train, kind: table }]
outputs: [{ name: model, kind: model }]
params_schema:
  type: object
  additionalProperties: false
  required: [target, features, task]
  properties:
    target: { type: string, minLength: 1, description: "Column to predict." }
    features: { type: array, items: { type: string, minLength: 1 }, uniqueItems: true, description: "Columns used as inputs (the baseline ignores them; kept for comparison)." }
    task: { type: string, enum: [classification, regression], description: "Predict a class or a number." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
