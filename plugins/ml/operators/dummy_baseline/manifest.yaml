schema_version: sprisk.operator/v1
id: sprisk.ml.dummy_baseline@1.1.0
capability_class: estimator
model: { tasks: [classification, regression], prepares: [fill_gaps, standardize], estimator: "sprisk_ml.models:dummy_baseline_estimator", complexity: 0 }
description: Majority class or mean predictor. The floor every model must beat.
entrypoint: sprisk_ml.models:dummy_baseline
notebook_code: sprisk_ml.models:dummy_baseline_as_code
inputs: [{ name: train, kind: table }]
outputs: [{ name: model, kind: model }]
params_schema:
  type: object
  additionalProperties: false
  required: [target, features, task]
  properties:
    target: { type: string, minLength: 1, description: "Column to predict." }
    features: { type: array, items: { type: string, minLength: 1 }, uniqueItems: true, description: "Columns used as inputs (the baseline ignores them; kept for comparison)." }
    task: { type: string, enum: [classification, regression], description: "Predict a class or a number." }
    costs:
      type: object
      additionalProperties: false
      required: [positive, false_negative, false_positive]
      description: "Misclassification costs of a two-class model (ADR-0053). With them, the model predicts by the cut-off that costs least on its own training rows."
      properties:
        positive: { type: string, minLength: 1, description: "The class whose miss costs, as text." }
        false_negative: { type: number, exclusiveMinimum: 0, description: "Cost of missing a `positive` row." }
        false_positive: { type: number, exclusiveMinimum: 0, description: "Cost of predicting `positive` for another row." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
