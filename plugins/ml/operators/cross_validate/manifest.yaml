schema_version: sprisk.operator/v1
id: sprisk.ml.cross_validate@3.0.0
capability_class: estimator
description: Score one candidate model by k-fold cross-validation of the split's train rows, refitting its whole pipeline in every fold (ADR-0044). One row per fold, plus out-of-fold predictions, permutation importance on held-out folds and their figures, all from train rows (ADR-0050). After a random split, stratified folds for classification; after a time or group split, folds that keep time order or whole groups. A study's trial also scores inner folds of each outer fold's training rows, and may score the recall of named classes for guardrails (ADR-0051).
entrypoint: sprisk_ml.compare:cross_validate
inputs: [{ name: train, kind: table }]
outputs: [{ name: scores, kind: table }, { name: predictions, kind: table }, { name: importance, kind: diagnostics }, { name: figures, kind: figure }]
params_schema:
  type: object
  additionalProperties: false
  required: [candidate, candidate_params, folds, repeats, seed, metric, prepare]
  properties:
    candidate:
      type: string
      pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+@(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
      description: "The model operator to score."
      x-sprisk-model-operator: candidate_params
    candidate_params: { type: object, description: "The model's params, as its own step would take them." }
    prepare:
      type: array
      description: "The preparation steps between the split and the model, in flow order; each fold refits them on its training rows before the model (ADR-0050)."
      items:
        type: object
        additionalProperties: false
        required: [operator, params]
        properties:
          operator: { type: string, pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+@(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$" }
          params: { type: object }
      x-sprisk-preparation: true
    time_column: { type: string, minLength: 1, description: "After a time split: folds follow this column, each validating on later rows than it fits on." }
    group_column: { type: string, minLength: 1, description: "After a group split: no value of this column is on both sides of a fold." }
    folds: { type: integer, minimum: 2, maximum: 20, description: "Number of folds. Every candidate in a comparison uses the same." }
    repeats: { type: integer, minimum: 1, maximum: 20, description: "How many times the rows are shuffled into folds; every candidate in a comparison uses the same (ADR-0050)." }
    seed: { type: integer, minimum: 0, description: "Shuffles the rows into folds, so every candidate gets the same folds." }
    metric: { type: string, enum: [balanced_accuracy, rmse], description: "Fixed before any score is seen: balanced_accuracy for classification, rmse for regression." }
    inner_folds: { type: integer, minimum: 2, maximum: 10, description: "A study's trial: folds within each outer fold's training rows, and within all train rows, that its settings are chosen on (ADR-0051)." }
    recall_of:
      type: array
      description: "Classes, as text, whose recall each outer fold also scores, for a study's guardrails (ADR-0051)."
      items: { type: string, minLength: 1 }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 1800 }
