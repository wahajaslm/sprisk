schema_version: sprisk.operator/v1
id: sprisk.clean.scale@1.0.0
title: Feature scaling
capability_class: transform
description: Min-max or z-score scaling with the train range or moments. Fit on train only.
entrypoint: sprisk_clean.scale:scale
notebook_code: sprisk_clean.scale:as_code
fits_on_train: true
inputs: [{ name: train, kind: table }, { name: test, kind: table }]
outputs: [{ name: train, kind: table }, { name: test, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [columns, method]
  properties:
    columns: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true, description: "Numeric columns to rescale." }
    method: { type: string, enum: [min_max, z_score, robust], description: "min_max maps the train range to 0..1; z_score centres on the train mean with unit spread; robust centres on the train median and divides by the train IQR." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
