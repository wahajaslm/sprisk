schema_version: sprisk.operator/v1
id: sprisk.clean.scale@1.0.0
capability_class: transform
description: Min-max or z-score scaling with the train range or moments. Fit on train only.
entrypoint: sprisk_clean.scale:scale
inputs: [{ name: train, kind: table }, { name: test, kind: table }]
outputs: [{ name: train, kind: table }, { name: test, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [columns, method]
  properties:
    columns: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true }
    method: { type: string, enum: [min_max, z_score] }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
