schema_version: sprisk.operator/v1
id: sprisk.clean.audit_images@1.0.0
title: Image asset audit
capability_class: analyzer
description: "Audits actual row-linked image assets before modelling: file coverage, decode failures, dimensions, aspect ratio, brightness and perceptual duplicate candidates."
entrypoint: sprisk_clean.audit_images:audit_images
scope: all
attach: { role: split, side: input }
inputs:
  - { name: data, kind: table }
outputs:
  - { name: evidence, kind: report }
produces:
  images.asset_quality:
    fields: { rows: integer, found: integer, missing: integer, unreadable: integer, coverage: number }
params_schema:
  type: object
  additionalProperties: false
  required: [image_dir, file_pattern]
  properties:
    image_dir: { type: string, minLength: 1, x-sprisk-local-path: true, x-sprisk-asset-root: image, description: "Folder of the row-linked images." }
    file_pattern: { type: string, minLength: 1, x-sprisk-asset-file: image, description: "How each row's file is named from its columns, e.g. {clip_path} or image_{imageid}.jpg." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 7200 }
