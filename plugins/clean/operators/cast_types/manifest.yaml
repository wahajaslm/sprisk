schema_version: sprisk.operator/v1
id: sprisk.clean.cast_types@1.0.0
title: Numeric type casting
capability_class: transform
stage: clean
description: Text columns that hold numbers become numbers. Fails on a value that does not read as a number, naming it.
entrypoint: sprisk_clean.columns:cast_types
inputs: [{ name: data, kind: table }]
outputs: [{ name: data, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [columns]
  properties:
    columns: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true, description: "Text columns to read as numbers." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 1024, gpu: none, timeout_seconds: 300 }
