schema_version: sprisk.operator/v1
id: sprisk.clean.drop_missing@1.0.0
title: Listwise deletion
capability_class: transform
role: row_filter
description: Drop rows with a missing value in any of the named columns. Use for the target, which must never be filled in.
entrypoint: sprisk_clean.columns:drop_missing
inputs: [{ name: data, kind: table }]
outputs: [{ name: data, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [columns]
  properties:
    columns: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true, description: "A row with a gap in any of these is dropped." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 1024, gpu: none, timeout_seconds: 300 }
