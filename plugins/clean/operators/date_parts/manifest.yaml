schema_version: sprisk.operator/v1
id: sprisk.clean.date_parts@1.0.0
capability_class: transform
description: Each date column becomes its year, month and weekday, with month and weekday also as sine and cosine, in place of the date. Each row on its own; nothing is learned.
entrypoint: sprisk_clean.date_parts:date_parts
# Learns nothing, so trivially from train only; train and test ports let a rule add it before a model (ADR-0057).
fits_on_train: true
inputs: [{ name: train, kind: table }, { name: test, kind: table }]
outputs: [{ name: train, kind: table }, { name: test, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [columns]
  properties:
    columns: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true, description: "Date or date-time columns to split into parts." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
