schema_version: sprisk.operator/v1
id: sprisk.clean.recording_copies@1.0.0
title: Repeated recordings
capability_class: analyzer
description: "Counts rows whose decoded audio repeats an earlier row's: one file listed twice, or one recording saved under two names. Labels are never read (ADR-0066)."
entrypoint: sprisk_clean.audio_assets:recording_copies
scope: all
attach: { role: split, side: input }
assets: { modality: audio, root_param: audio_dir, link_param: audio_path_column }
inputs: [{ name: data, kind: table }]
outputs: [{ name: evidence, kind: report }]
produces:
  audio.recording_copies:
    fields: { rows: integer, hashed: integer, missing: integer, unreadable: integer, copies: integer, groups: integer, largest_group: integer }
params_schema:
  type: object
  additionalProperties: false
  required: [audio_dir, audio_path_column]
  properties:
    audio_dir: { type: string, minLength: 1, description: "Root directory of audio files." }
    audio_path_column: { type: string, minLength: 1, x-sprisk-column: true, description: "Relative audio-file path for each row." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 7200 }
