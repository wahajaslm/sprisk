schema_version: sprisk.operator/v1
id: sprisk.clean.group_rare@1.0.0
capability_class: transform
description: Categories under a share of the train rows become "other", in each text column. At most max_categories values stay, counting "other". A category seen only in test rows becomes "other" too.
entrypoint: sprisk_clean.group_rare:group_rare
fits_on_train: true
inputs: [{ name: train, kind: table }, { name: test, kind: table }]
outputs: [{ name: train, kind: table }, { name: test, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [columns]
  properties:
    columns: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true, description: "Text columns whose rare categories become \"other\"." }
    min_share: { type: number, exclusiveMinimum: 0, maximum: 1, default: 0.01, description: "A category under this share of the train rows is rare." }
    max_categories: { type: integer, minimum: 2, description: "Most values a column may keep, counting \"other\"; only the most frequent stay. Left out: no limit." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
