schema_version: sprisk.operator/v1
id: sprisk.clean.leave_out@1.0.0
title: Feature removal
capability_class: transform
stage: clean
description: Leave the named columns out of the train and test rows, so the model does not read them.
entrypoint: sprisk_clean.columns:leave_out
# Learns nothing, so trivially from train only; train and test ports let a method add it before a model.
fits_on_train: true
inputs: [{ name: train, kind: table }, { name: test, kind: table }]
outputs: [{ name: train, kind: table }, { name: test, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [columns]
  properties:
    columns: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true, description: "Columns the model does not read." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 1024, gpu: none, timeout_seconds: 300 }
