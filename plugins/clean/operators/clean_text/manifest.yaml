schema_version: sprisk.operator/v1
id: sprisk.clean.clean_text@1.0.0
title: Text normalization
capability_class: transform
stage: clean
description: Tidy text columns. Trim and collapse spaces, optionally lowercase; blank text becomes missing.
entrypoint: sprisk_clean.clean_text:clean_text
inputs: [{ name: data, kind: table }]
outputs: [{ name: data, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [columns]
  properties:
    columns: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true, description: "Text columns to clean." }
    lowercase: { type: boolean, default: false, description: "Make every letter lowercase." }
    empty_to_null: { type: boolean, default: true, description: "Treat blank text as a missing value." }
    exclude: { type: array, items: { type: string, minLength: 1 }, uniqueItems: true, description: "Columns to leave as typed, even when columns names them, such as the target." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 1024, gpu: none, timeout_seconds: 300 }
