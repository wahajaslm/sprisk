schema_version: sprisk.operator/v1
id: sprisk.clean.encode@1.0.0
title: One-hot encoding
capability_class: transform
stage: clean
description: One 0/1 column per category of each text column, with the categories the train rows have. A category seen only in test rows gets zeros.
entrypoint: sprisk_clean.encode:encode
notebook_code: sprisk_clean.encode:as_code
fits_on_train: true
inputs: [{ name: train, kind: table }, { name: test, kind: table }]
outputs: [{ name: train, kind: table }, { name: test, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [columns]
  properties:
    columns: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true, description: "Text columns to encode, one 0/1 column per category." }
effects: pure
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
