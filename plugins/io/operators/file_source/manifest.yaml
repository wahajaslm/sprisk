schema_version: sprisk.operator/v1
id: sprisk.io.file_source@1.0.0
title: File source
capability_class: source
role: source
role_default: true
description: Read a local CSV or Parquet file into a Parquet table.
entrypoint: sprisk_io.file_source:file_source
notebook_code: sprisk_io.file_source:as_code
inputs: []
outputs: [{ name: data, kind: table }]
params_schema:
  type: object
  additionalProperties: false
  required: [path, format]
  properties:
    path: { type: string, minLength: 1, x-sprisk-local-path: true, description: "File to read, inside an allowed data folder." }
    format: { type: string, enum: [csv, parquet], description: "How the file is stored." }
    missing_values: { type: array, items: { type: string }, default: ["NA"], description: "Text that means a value is missing, in a CSV." }
# The file can change between runs, so the output is not cacheable.
effects: nondeterministic
network: none
resources: { cpu_cores: 1, memory_mb: 2048, gpu: none, timeout_seconds: 600 }
