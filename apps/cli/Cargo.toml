[package]
name = "sprisk-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sprisk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = "1.0.229"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
sprisk-api = { path = "../../crates/sprisk-api" }
sprisk-artifacts = { path = "../../crates/sprisk-artifacts" }
sprisk-contracts = { path = "../../crates/sprisk-contracts" }
sprisk-registry = { path = "../../crates/sprisk-registry" }
sprisk-scheduler = { path = "../../crates/sprisk-scheduler" }
sprisk-store = { path = "../../crates/sprisk-store" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "time"] }
tracing-subscriber = "0.3"
ulid = "1"
yaml_serde = "0.10.7"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
